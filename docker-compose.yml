version: '3.9'

# ─── MUSIC OS 360 — Local Development Stack ──────────────────────────────────
# Serviços: PostgreSQL + Redis + API NestJS
# Frontend (Vite) corre localmente via `npm run dev:web` — não containerizado.
#
# Uso (--env-file explícito — Docker Compose não descobre mais um `.env`
# implícito na raiz; o nome canônico agora é .env.development):
#   docker compose --env-file .env.development up -d          # subir todos os serviços em background
#   docker compose --env-file .env.development logs -f api    # acompanhar logs da API
#   docker compose --env-file .env.development down -v        # parar e remover volumes
#
# Variáveis de ambiente: editar .env.development diretamente (arquivo real,
# fora do Git — não é mais um template .example a copiar).

services:
  # ─── PostgreSQL (local, OPCIONAL) ─────────────────────────────────────────────
  # Não é requisito para subir a aplicação: em development, apps/api conecta
  # diretamente ao Postgres remoto do Supabase DEV via DATABASE_URL
  # (.env.development). Este serviço só sobe com `--profile local-db`, para quem
  # quiser um Postgres local isolado (ex.: testes offline sem Supabase).
  postgres:
    profiles: ['local-db']
    image: postgres:16-alpine
    container_name: musicos360_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-musicos360}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-musicos360}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U musicos360']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: musicos360_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── NestJS API ──────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    container_name: musicos360_api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in local .env}
      DB_SSL: ${DB_SSL:-false}
      REDIS_QUEUE_URL: redis://redis:6379
      REDIS_URL: redis://redis:6379
      RBAC_PERSISTED_AUTHORITY: SHADOW
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      # Preencher com valores reais (ou usar .env):
      SUPABASE_URL: ${SUPABASE_URL:-https://placeholder.supabase.co}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set in local .env}
      CORS_ORIGINS: http://localhost:5000
    ports:
      - '3001:3001'
    volumes:
      - api_logs:/app/apps/api/logs
    healthcheck:
      # NOTE: distroless image has no shell/wget. Use TCP probe via /nodejs/bin/node.
      test: ['CMD', '/nodejs/bin/node', '-e', "require('http').get('http://localhost:3001/api/v1/health/live', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  postgres_data:
    name: musicos360_postgres_data
  redis_data:
    name: musicos360_redis_data
  api_logs:
    name: musicos360_api_logs
