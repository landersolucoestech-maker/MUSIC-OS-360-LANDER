name: One-shot Supabase ref alignment

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/one-shot-align-supabase-refs.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Align backend, tests and CI refs
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          schema_path = Path('apps/api/src/core/config/env.schema.ts')
          schema = schema_path.read_text()
          schema = schema.replace(
              "//   development → SOMENTE DEV_REF; MAIN/STAGING/PROD explicitamente proibidos.\n",
              "//   development → SOMENTE DEV_REF; STAGING/PROD explicitamente proibidos.\n",
          )
          schema = schema.replace(
              "// MAIN_REF é a branch principal do projeto Supabase — NÃO é sinônimo de\n"
              "// produção e não é aceito por nenhum NODE_ENV de runtime.\n"
              "export const SUPABASE_PROD_REF = 'jtizbxbrwyczbkdiruoq'; // confirmar por fonte administrativa antes de usar\n",
              "// O projeto Supabase MAIN é o ambiente de produção e permanece intacto até a liberação formal.\n"
              "export const SUPABASE_PROD_REF = 'sxmfeocztlztvpdnxayk';\n",
          )
          schema = schema.replace(
              "/** Branch MAIN do projeto Supabase (contém o schema real; ≠ produção). */\n"
              "export const SUPABASE_MAIN_REF = 'sxmfeocztlztvpdnxayk';\n",
              "",
          )
          schema = schema.replace(
              "  SUPABASE_STAGING_REF,\n  SUPABASE_MAIN_REF,\n  SUPABASE_DEV_REF,\n",
              "  SUPABASE_STAGING_REF,\n  SUPABASE_DEV_REF,\n",
          )
          assert 'jtizbxbrwyczbkdiruoq' not in schema
          assert 'SUPABASE_MAIN_REF' not in schema
          schema_path.write_text(schema)

          spec_path = Path('apps/api/src/core/config/env.schema.spec.ts')
          spec = spec_path.read_text()
          spec = spec.replace("  SUPABASE_MAIN_REF,\n", "")
          spec = re.sub(
              r"\n    it\('MAIN_REF nunca é o esperado de nenhum ambiente \(main ≠ production\)', \(\) => \{.*?\n    \}\);",
              "\n    it('production usa o projeto Supabase main real', () => {\n"
              "      expect(expectedSupabaseRef('production')).toBe(SUPABASE_PROD_REF);\n"
              "      expect(SUPABASE_PROD_REF).toBe('sxmfeocztlztvpdnxayk');\n"
              "      expect(forbiddenSupabaseRefs('production')).not.toContain(SUPABASE_PROD_REF);\n"
              "    });",
              spec,
              flags=re.S,
          )
          spec = spec.replace(
              "    it('development + MAIN_REF → falha (denylist cruzada)', () => {\n"
              "      const errors = collectSupabaseEnvErrors({ DATABASE_URL: pooler(SUPABASE_MAIN_REF) }, 'development');\n"
              "      expect(errors.some((e) => e.includes('OUTRO ambiente') && e.includes(SUPABASE_MAIN_REF))).toBe(true);\n"
              "    });\n",
              "    it('development + projeto de produção → falha (denylist cruzada)', () => {\n"
              "      const errors = collectSupabaseEnvErrors({ DATABASE_URL: pooler(SUPABASE_PROD_REF) }, 'development');\n"
              "      expect(errors.some((e) => e.includes('OUTRO ambiente') && e.includes(SUPABASE_PROD_REF))).toBe(true);\n"
              "    });\n",
          )
          spec = re.sub(
              r"\n    it\('production \+ MAIN_REF → falha \(main não é sinônimo de production\)', \(\) => \{.*?\n    \}\);",
              "",
              spec,
              flags=re.S,
          )
          spec = spec.replace("jwtFor(SUPABASE_MAIN_REF, 'anon')", "jwtFor(SUPABASE_STAGING_REF, 'anon')")
          spec = spec.replace("e.includes('SUPABASE_ANON_KEY') && e.includes('OUTRO ambiente')", "e.includes('SUPABASE_ANON_KEY') && e.includes('OUTRO ambiente')")
          spec = spec.replace("direct(SUPABASE_MAIN_REF)", "direct(SUPABASE_PROD_REF)")
          spec = spec.replace(
              "    it('development + MAIN → bloqueado', () => {\n"
              "      const errors = collectDatabaseCommandErrors({ DATABASE_URL: pooler(SUPABASE_MAIN_REF) }, 'development');\n",
              "    it('development + projeto de produção → bloqueado', () => {\n"
              "      const errors = collectDatabaseCommandErrors({ DATABASE_URL: pooler(SUPABASE_PROD_REF) }, 'development');\n",
          )
          assert 'SUPABASE_MAIN_REF' not in spec
          spec_path.write_text(spec)

          ci_path = Path('.github/workflows/ci.yml')
          ci = ci_path.read_text()
          ci = ci.replace('jtizbxbrwyczbkdiruoq', 'sxmfeocztlztvpdnxayk')
          ci_path.write_text(ci)

          Path('.github/workflows/one-shot-align-supabase-refs.yml').unlink()
          PY
      - name: Verify patch scope
        run: |
          git diff --check
          ! git grep -n 'jtizbxbrwyczbkdiruoq' -- ':!docs/SUPABASE_ENVIRONMENTS.md'
          ! git grep -n 'SUPABASE_MAIN_REF'
          git diff --name-only
      - name: Commit patch
        run: |
          git config user.name "landersolucoestech-maker"
          git config user.email "landersolucoestech@gmail.com"
          git add apps/api/src/core/config/env.schema.ts \
                  apps/api/src/core/config/env.schema.spec.ts \
                  .github/workflows/ci.yml \
                  .github/workflows/one-shot-align-supabase-refs.yml
          git commit -m "fix(env): align backend Supabase production ref with main project"
          git push origin HEAD:dev
