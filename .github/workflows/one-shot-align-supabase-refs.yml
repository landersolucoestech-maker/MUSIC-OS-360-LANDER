name: One-shot Supabase ref alignment

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/one-shot-align-supabase-refs.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Align backend guard and tests
        run: |
          python3 <<'PY'
          from pathlib import Path

          schema_path = Path('apps/api/src/core/config/env.schema.ts')
          schema = schema_path.read_text()
          schema = schema.replace(
              "//   development → SOMENTE DEV_REF; MAIN/STAGING/PROD explicitamente proibidos.\n",
              "//   development → SOMENTE DEV_REF; STAGING/PROD explicitamente proibidos.\n",
          )
          schema = schema.replace(
              "// MAIN_REF é a branch principal do projeto Supabase — NÃO é sinônimo de\n"
              "// produção e não é aceito por nenhum NODE_ENV de runtime.\n"
              "export const SUPABASE_PROD_REF = 'jtizbxbrwyczbkdiruoq'; // confirmar por fonte administrativa antes de usar\n",
              "// O projeto Supabase MAIN é o ambiente de produção e permanece intacto até a liberação formal.\n"
              "export const SUPABASE_PROD_REF = 'sxmfeocztlztvpdnxayk';\n",
          )
          schema = schema.replace(
              "/** Branch MAIN do projeto Supabase (contém o schema real; ≠ produção). */\n"
              "export const SUPABASE_MAIN_REF = 'sxmfeocztlztvpdnxayk';\n",
              "/** Alias legado para guards operacionais que bloqueiam explicitamente produção. */\n"
              "export const SUPABASE_MAIN_REF = SUPABASE_PROD_REF;\n",
          )
          schema = schema.replace(
              "  SUPABASE_STAGING_REF,\n  SUPABASE_MAIN_REF,\n  SUPABASE_DEV_REF,\n",
              "  SUPABASE_STAGING_REF,\n  SUPABASE_DEV_REF,\n",
          )
          assert 'jtizbxbrwyczbkdiruoq' not in schema
          assert "export const SUPABASE_MAIN_REF = SUPABASE_PROD_REF;" in schema
          schema_path.write_text(schema)

          spec_path = Path('apps/api/src/core/config/env.schema.spec.ts')
          spec = spec_path.read_text()
          spec = spec.replace(
              "    it('MAIN_REF nunca é o esperado de nenhum ambiente (main ≠ production)', () => {\n"
              "      for (const env of ['development', 'test', 'staging', 'production']) {\n"
              "        expect(expectedSupabaseRef(env)).not.toBe(SUPABASE_MAIN_REF);\n"
              "        expect(forbiddenSupabaseRefs(env)).toContain(SUPABASE_MAIN_REF);\n"
              "      }\n"
              "    });\n",
              "    it('MAIN_REF é alias do projeto de produção real', () => {\n"
              "      expect(SUPABASE_MAIN_REF).toBe(SUPABASE_PROD_REF);\n"
              "      expect(SUPABASE_PROD_REF).toBe('sxmfeocztlztvpdnxayk');\n"
              "      expect(expectedSupabaseRef('production')).toBe(SUPABASE_MAIN_REF);\n"
              "      expect(forbiddenSupabaseRefs('production')).not.toContain(SUPABASE_MAIN_REF);\n"
              "    });\n",
          )
          spec = spec.replace(
              "    it('production + MAIN_REF → falha (main não é sinônimo de production)', () => {\n"
              "      const errors = collectSupabaseEnvErrors({\n"
              "        SUPABASE_URL: url(SUPABASE_MAIN_REF),\n"
              "        DATABASE_URL: pooler(SUPABASE_MAIN_REF),\n"
              "        SUPABASE_ANON_KEY: jwtFor(SUPABASE_MAIN_REF, 'anon'),\n"
              "      }, 'production');\n"
              "      expect(errors.some((e) => e.includes('OUTRO ambiente'))).toBe(true);\n"
              "    });\n",
              "    it('production + MAIN_REF → passa porque MAIN é produção', () => {\n"
              "      const errors = collectSupabaseEnvErrors({\n"
              "        SUPABASE_URL: url(SUPABASE_MAIN_REF),\n"
              "        DATABASE_URL: pooler(SUPABASE_MAIN_REF),\n"
              "        SUPABASE_ANON_KEY: jwtFor(SUPABASE_MAIN_REF, 'anon'),\n"
              "      }, 'production');\n"
              "      expect(errors).toEqual([]);\n"
              "    });\n",
          )
          spec_path.write_text(spec)
          PY
      - name: Verify patch scope
        run: |
          git diff --check
          ! git grep -n 'jtizbxbrwyczbkdiruoq' -- apps/api/src/core/config/env.schema.ts
          git diff --name-only
      - name: Commit patch
        run: |
          git config user.name "landersolucoestech-maker"
          git config user.email "landersolucoestech@gmail.com"
          git add apps/api/src/core/config/env.schema.ts apps/api/src/core/config/env.schema.spec.ts
          git commit -m "fix(env): align backend Supabase production ref with main project"
          git push origin HEAD:dev
