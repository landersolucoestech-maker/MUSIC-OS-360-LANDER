name: Repair OAuth PR

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/repair-oauth-pr.yml

permissions:
  contents: write

concurrency:
  group: repair-oauth-pr
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/oauth-token-boundary
          fetch-depth: 0

      - name: Apply reviewed fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, got {count}")
              return text.replace(old, new, 1)

          invoices = Path('apps/api/src/modules/invoices/invoices.service.ts')
          source = invoices.read_text()
          source = replace_once(
              source,
              "          dataVencimento: after['vencimento'] ?? after['data_vencimento'] ?? nowIso,\n",
              "          dataVencimento: String(after['vencimento'] ?? after['data_vencimento'] ?? nowIso),\n",
              'invoice overdue date',
          )
          invoices.write_text(source)

          licensing = Path('apps/api/src/modules/licensing/licensing.service.ts')
          source = licensing.read_text()
          source = replace_once(
              source,
              "   * `percentage` é preservado em metadata até existir coluna física canônica.\n",
              "   * `percentage` corresponde à coluna física canônica percentage.\n",
              'licensing documentation',
          )
          source = replace_once(
              source,
              '''  private normalizePayload(
            dto: CreateLicenseDto | UpdateLicenseDto,
            currentMetadata: Record<string, unknown> = {},
          ): Record<string, unknown> {
            const {
              amount,
              currency,
              percentage,
              valor,
              moeda,
              ...rest
            } = dto;

            const metadata = { ...currentMetadata };
            if (percentage !== undefined) metadata['percentage'] = percentage;

            return {
              ...rest,
              ...(amount !== undefined || valor !== undefined ? { valor: amount ?? valor ?? null } : {}),
              ...(currency !== undefined || moeda !== undefined ? { moeda: currency ?? moeda ?? null } : {}),
              ...(percentage !== undefined ? { metadata } : {}),
            };
          }
''',
              '''  private normalizePayload(
            dto: CreateLicenseDto | UpdateLicenseDto,
          ): Record<string, unknown> {
            const {
              amount,
              currency,
              percentage,
              valor,
              moeda,
              ...rest
            } = dto;

            return {
              ...rest,
              ...(amount !== undefined || valor !== undefined ? { valor: amount ?? valor ?? null } : {}),
              ...(currency !== undefined || moeda !== undefined ? { moeda: currency ?? moeda ?? null } : {}),
              ...(percentage !== undefined ? { percentage } : {}),
            };
          }
''',
              'licensing normalize payload',
          )
          source = replace_once(
              source,
              '''    const metadata = (raw['metadata'] && typeof raw['metadata'] === 'object')
              ? raw['metadata'] as Record<string, unknown>
              : {};
            return {
              ...raw,
              amount: raw['valor'] ?? null,
              currency: raw['moeda'] ?? 'BRL',
              percentage: metadata['percentage'] ?? null,
            };
''',
              '''    return {
              ...raw,
              amount: raw['valor'] ?? null,
              currency: raw['moeda'] ?? 'BRL',
              percentage: raw['percentage'] == null ? null : Number(raw['percentage']),
            };
''',
              'licensing response mapping',
          )
          source = replace_once(
              source,
              "        ...this.normalizePayload(dto, current.metadata ?? {}),\n",
              "        ...this.normalizePayload(dto),\n",
              'licensing update payload',
          )
          licensing.write_text(source)

          entities = Path('apps/api/src/database/entities.ts')
          source = entities.read_text()
          match = re.search(r"export class LicenseEntity \{.*?\n\}", source, re.DOTALL)
          if not match:
              raise SystemExit('LicenseEntity not found')
          block = match.group(0)
          if ' percentage:' not in block:
              marker = "  @Column({ type: 'varchar', length: 50, nullable: true }) remuneration_type: string | null;\n"
              if block.count(marker) != 1:
                  raise SystemExit('LicenseEntity remuneration_type marker mismatch')
              block = block.replace(
                  marker,
                  marker + "  @Column({ type: 'decimal', precision: 7, scale: 4, nullable: true }) percentage: string | null;\n",
                  1,
              )
              source = source[:match.start()] + block + source[match.end():]
          entities.write_text(source)

          migration = Path('apps/api/src/database/migrations/20260804000001_AddLicensePercentage.ts')
          migration.write_text('''import { MigrationInterface, QueryRunner } from 'typeorm';

          export class AddLicensePercentage20260804000001 implements MigrationInterface {
            name = 'AddLicensePercentage20260804000001';

            public async up(queryRunner: QueryRunner): Promise<void> {
              await queryRunner.query(`
                ALTER TABLE "licenses"
                ADD COLUMN IF NOT EXISTS "percentage" numeric(7,4)
              `);
              await queryRunner.query(`
                DO $$
                BEGIN
                  IF NOT EXISTS (
                    SELECT 1 FROM pg_constraint
                    WHERE conname = 'CHK_licenses_percentage_range'
                      AND conrelid = 'licenses'::regclass
                  ) THEN
                    ALTER TABLE "licenses"
                    ADD CONSTRAINT "CHK_licenses_percentage_range"
                    CHECK ("percentage" IS NULL OR ("percentage" >= 0 AND "percentage" <= 100));
                  END IF;
                END $$
              `);
            }

            public async down(queryRunner: QueryRunner): Promise<void> {
              await queryRunner.query(`
                ALTER TABLE "licenses"
                DROP CONSTRAINT IF EXISTS "CHK_licenses_percentage_range"
              `);
              await queryRunner.query(`
                ALTER TABLE "licenses"
                DROP COLUMN IF EXISTS "percentage"
              `);
            }
          }
          ''')

          token_service = Path('apps/api/src/modules/integrations/oauth-exchange-token.service.ts')
          token_service.write_text('''import {
            BadRequestException,
            Injectable,
            InternalServerErrorException,
          } from '@nestjs/common';
          import { ConfigService } from '@nestjs/config';
          import { createHmac, randomUUID, timingSafeEqual } from 'crypto';

          export interface OAuthExchangeContext {
            platform: string;
            tenantId: string;
            userId: string;
            expiresAt: number;
            tokenId: string;
          }

          type SignedPayload = {
            version: 1;
            platform: string;
            tenantId: string;
            userId: string;
            expiresAt: number;
            tokenId: string;
          };

          @Injectable()
          export class OAuthExchangeTokenService {
            private static readonly TTL_MS = 10 * 60 * 1000;

            constructor(private readonly config: ConfigService) {}

            issue(input: Omit<OAuthExchangeContext, 'expiresAt' | 'tokenId'>): string {
              const payload: SignedPayload = {
                version: 1,
                ...input,
                expiresAt: Date.now() + OAuthExchangeTokenService.TTL_MS,
                tokenId: randomUUID(),
              };
              const encodedPayload = Buffer.from(JSON.stringify(payload), 'utf8').toString('base64url');
              return `${encodedPayload}.${this.sign(encodedPayload)}`;
            }

            verify(token: string): OAuthExchangeContext {
              const [encodedPayload, providedSignature, extraPart] = token.split('.');
              if (!encodedPayload || !providedSignature || extraPart !== undefined) {
                throw new BadRequestException('exchange_token inválido. Inicie a autorização novamente.');
              }

              const expectedSignature = this.sign(encodedPayload);
              const expectedBuffer = Buffer.from(expectedSignature, 'base64url');
              const providedBuffer = Buffer.from(providedSignature, 'base64url');
              if (
                expectedBuffer.length !== providedBuffer.length ||
                !timingSafeEqual(expectedBuffer, providedBuffer)
              ) {
                throw new BadRequestException('exchange_token inválido. Inicie a autorização novamente.');
              }

              let payload: unknown;
              try {
                payload = JSON.parse(Buffer.from(encodedPayload, 'base64url').toString('utf8'));
              } catch {
                throw new BadRequestException('exchange_token inválido. Inicie a autorização novamente.');
              }

              if (!this.isSignedPayload(payload) || payload.expiresAt <= Date.now()) {
                throw new BadRequestException('exchange_token inválido ou expirado. Inicie a autorização novamente.');
              }

              return {
                platform: payload.platform,
                tenantId: payload.tenantId,
                userId: payload.userId,
                expiresAt: payload.expiresAt,
                tokenId: payload.tokenId,
              };
            }

            private sign(encodedPayload: string): string {
              return createHmac('sha256', this.getSecret())
                .update(encodedPayload)
                .digest('base64url');
            }

            private getSecret(): string {
              const secret = this.config.get<string>('OAUTH_EXCHANGE_SECRET') ??
                this.config.get<string>('JWT_SECRET');
              if (!secret || secret.length < 32) {
                throw new InternalServerErrorException(
                  'OAUTH_EXCHANGE_SECRET ou JWT_SECRET forte não configurado',
                );
              }
              return secret;
            }

            private isSignedPayload(value: unknown): value is SignedPayload {
              if (!value || typeof value !== 'object') return false;
              const payload = value as Record<string, unknown>;
              return payload['version'] === 1 &&
                typeof payload['platform'] === 'string' && payload['platform'].length > 0 &&
                typeof payload['tenantId'] === 'string' && payload['tenantId'].length > 0 &&
                typeof payload['userId'] === 'string' && payload['userId'].length > 0 &&
                typeof payload['expiresAt'] === 'number' && Number.isFinite(payload['expiresAt']) &&
                typeof payload['tokenId'] === 'string' && payload['tokenId'].length > 0;
            }
          }
          ''')

          token_spec = Path('apps/api/src/modules/integrations/oauth-exchange-token.service.spec.ts')
          token_spec.write_text('''import { BadRequestException } from '@nestjs/common';
          import { OAuthExchangeTokenService } from './oauth-exchange-token.service';

          describe('OAuthExchangeTokenService', () => {
            const service = new OAuthExchangeTokenService({
              get: jest.fn((key: string) => key === 'JWT_SECRET'
                ? '0123456789abcdef0123456789abcdef'
                : undefined),
            } as never);

            it('issues and verifies a portable short-lived context token', () => {
              const token = service.issue({
                platform: 'tiktok_business',
                tenantId: 'tenant-1',
                userId: 'user-1',
              });

              expect(service.verify(token)).toMatchObject({
                platform: 'tiktok_business',
                tenantId: 'tenant-1',
                userId: 'user-1',
              });
            });

            it('rejects a tampered token', () => {
              const token = service.issue({
                platform: 'google_ads',
                tenantId: 'tenant-1',
                userId: 'user-1',
              });
              const [payload, signature] = token.split('.');

              expect(() => service.verify(`${payload}x.${signature}`)).toThrow(BadRequestException);
            });
          });
          ''')

          module = Path('apps/api/src/modules/integrations/integrations.module.ts')
          source = module.read_text()
          source = replace_once(
              source,
              "import { IntegrationBaseService } from './integration-base.service';\n",
              "import { IntegrationBaseService } from './integration-base.service';\nimport { OAuthExchangeTokenService } from './oauth-exchange-token.service';\n",
              'integrations module token service import',
          )
          source = replace_once(
              source,
              "  IntegrationBaseService,\n",
              "  IntegrationBaseService,\n  OAuthExchangeTokenService,\n",
              'integrations module token service provider',
          )
          module.write_text(source)

          dto = Path('apps/api/src/modules/integrations/dto/integrations.dto.ts')
          source = dto.read_text()
          source = replace_once(
              source,
              "IsObject, Matches } from 'class-validator';\n",
              "IsObject, Matches, MaxLength } from 'class-validator';\n",
              'OAuth dto MaxLength import',
          )
          source = replace_once(
              source,
              "  @ApiProperty({ description: 'Token de troca de uso único emitido por POST /oauth/init (substitui redirect_uri)' })\n  @IsString() @IsNotEmpty()\n  exchange_token!: string;\n",
              "  @ApiProperty({ description: 'Contexto OAuth assinado, de curta duração, emitido por POST /oauth/init' })\n  @IsString() @IsNotEmpty() @MaxLength(2048)\n  exchange_token!: string;\n",
              'OAuth dto exchange token documentation',
          )
          dto.write_text(source)

          controller = Path('apps/api/src/modules/integrations/integrations.controller.ts')
          source = controller.read_text()
          source = replace_once(source, "import { randomUUID }    from 'crypto';\n", '', 'controller randomUUID import')
          source = replace_once(source, "import { CacheService }  from '../../core/cache/cache.service';\n", '', 'controller cache import')
          source = replace_once(
              source,
              "import { IntegrationBaseService } from './integration-base.service';\n",
              "import { IntegrationBaseService } from './integration-base.service';\nimport { OAuthExchangeTokenService } from './oauth-exchange-token.service';\n",
              'controller token service import',
          )
          source = replace_once(
              source,
              "    private readonly config:      ConfigService,\n    private readonly cache:       CacheService,\n",
              "    private readonly config:      ConfigService,\n    private readonly oauthExchangeTokens: OAuthExchangeTokenService,\n",
              'controller token service injection',
          )
          init_pattern = re.compile(
              r"  /\*\*\n   \* Step 1 of the marketing OAuth flow\..*?\n  \}\n\n  // ─── OAuth exchange",
              re.DOTALL,
          )
          init_replacement = '''  /**
           * Step 1 of the marketing OAuth flow.
           * Creates a signed, short-lived context token containing the authenticated
           * tenant, user and target platform. The callback can be served by any API
           * instance; no in-memory affinity is required.
           */
          @Post('oauth/init')
          @RequireRole('editor')
          @HttpCode(HttpStatus.OK)
          @ApiOperation({ summary: 'Emite contexto OAuth assinado para iniciar integração' })
          oauthInit(@Body() dto: OAuthInitDto, @Request() req: any): { exchange_token: string } {
            const tenantId = req.tenant?.id ?? req.tenantId;
            const userId = req.auth?.userId ?? req.userId;
            if (!tenantId || !userId) {
              throw new BadRequestException('Contexto autenticado ausente para iniciar OAuth.');
            }
            return {
              exchange_token: this.oauthExchangeTokens.issue({
                platform: dto.platform,
                tenantId,
                userId,
              }),
            };
          }

          // ─── OAuth exchange'''
          source, count = init_pattern.subn(init_replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'controller oauth init block mismatch: {count}')

          source = replace_once(
              source,
              "  const cacheKey = `oauth_exchange:${exchange_token}`;\n  const entry = this.cache.get<{ platform: string; tenantId?: string; userId?: string }>(cacheKey);\n  if (!entry) {\n    throw new BadRequestException('exchange_token inválido ou expirado. Inicie a autorização novamente.');\n  }\n  if (entry.platform !== platform) {\n    throw new BadRequestException('exchange_token não corresponde à plataforma solicitada.');\n  }\n  this.cache.delete(cacheKey);\n\n  if (!entry.tenantId || !entry.userId) {\n    throw new BadRequestException('Contexto autenticado ausente para persistir a conexão OAuth.');\n  }\n",
              "  const entry = this.oauthExchangeTokens.verify(exchange_token);\n  if (entry.platform !== platform) {\n    throw new BadRequestException('exchange_token não corresponde à plataforma solicitada.');\n  }\n  const { tenantId, userId } = entry;\n",
              'controller exchange token verification',
          )
          source = source.replace("      tenantId: entry.tenantId!,\n      userId: entry.userId!,\n", "      tenantId,\n      userId,\n", 1)

          block_start = source.index("  @Post('oauth/exchange')\n")
          block_end = source.index("  // ─── Status geral", block_start)
          block = source[block_start:block_end]
          lines = block.splitlines(keepends=True)
          block = lines[0] + ''.join(
              ('  ' + line if line.strip() else line)
              for line in lines[1:]
          )
          source = source[:block_start] + block + source[block_end:]
          controller.write_text(source)

          controller_spec = Path('apps/api/src/modules/integrations/integrations.oauth-security.spec.ts')
          source = controller_spec.read_text()
          source = source.replace(
              '''    const cache = {
                get: jest.fn().mockReturnValue({
                  platform: 'tiktok_business',
                  tenantId: 'tenant-1',
                  userId: 'user-1',
                }),
                delete: jest.fn(),
                set: jest.fn(),
              };
''',
              '''    const oauthExchangeTokens = {
                verify: jest.fn().mockReturnValue({
                  platform: 'tiktok_business',
                  tenantId: 'tenant-1',
                  userId: 'user-1',
                  expiresAt: Date.now() + 60_000,
                  tokenId: 'token-1',
                }),
                issue: jest.fn(),
              };
''',
              1,
          )
          source = source.replace(
              "      cache as never,\n",
              "      oauthExchangeTokens as never,\n",
              1,
          )
          source = source.replace(
              "    return { controller, cache, integrationBase };\n",
              "    return { controller, oauthExchangeTokens, integrationBase };\n",
              1,
          )
          source = source.replace(
              "    const { controller, integrationBase, cache } = buildController();\n",
              "    const { controller, integrationBase, oauthExchangeTokens } = buildController();\n",
              1,
          )
          source = source.replace(
              "    expect(cache.delete).toHaveBeenCalledWith('oauth_exchange:single-use-token');\n",
              "    expect(oauthExchangeTokens.verify).toHaveBeenCalledWith('single-use-token');\n",
              1,
          )
          controller_spec.write_text(source)

          Path('.github/workflows/fix-dev-typecheck-blockers.yml').unlink(missing_ok=True)
          PY

      - name: Commit feature fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(api): harden OAuth context and align license schema"
          git push origin HEAD:fix/oauth-token-boundary

      - name: Remove repair workflow from dev
        shell: bash
        run: |
          git fetch origin dev
          git checkout -B dev origin/dev
          rm .github/workflows/repair-oauth-pr.yml
          git add .github/workflows/repair-oauth-pr.yml
          git commit -m "chore(ci): remove completed OAuth PR repair"
          git push origin HEAD:dev
