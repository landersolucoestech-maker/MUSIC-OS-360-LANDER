name: Repair project report contract (one-off)

on:
  push:
    branches: [dev]
    paths:
      - scripts/repair-project-report-contract.py
      - .github/workflows/repair-project-report-oneoff.yml

permissions:
  contents: write

concurrency:
  group: repair-project-report-oneoff
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic repair
        run: python scripts/repair-project-report-contract.py
      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/modules/reports/form-contracts/report-form-contracts.ts \
            apps/api/src/modules/reports/i18n/field-labels.pt-br.ts
          git commit -m "fix(projects): align single-sheet report columns with modal"
          git push origin HEAD:dev
