name: DEV One-off — Cleanup Invoice and Reports

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/dev-cleanup-invoice-report-oneoff.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply cleanup
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          hook = Path('apps/web/src/modules/accounting/components/nota-fiscal-form/hooks/useNotaFiscalForm.ts')
          text = hook.read_text()
          for item in [
              '  selectedFile: File | null;\n',
              '  handleFileChange: (e: React.ChangeEvent<HTMLInputElement>) => void;\n',
              '  setSelectedFile: (f: File | null) => void;\n',
              '  const [selectedFile, setSelectedFile] = useState<File | null>(null);\n',
              '    setSelectedFile(null);\n',
              '    selectedFile,\n',
              '    handleFileChange,\n',
              '    setSelectedFile,\n',
          ]:
              if text.count(item) != 1:
                  raise SystemExit(f'hook expected one occurrence of {item!r}, found {text.count(item)}')
              text = text.replace(item, '', 1)
          start = text.index('  // ── File handling ')
          end = text.index('  // ── Manual recalculate ', start)
          text = text[:start] + text[end:]
          dead = '''      const uploadFile = async (_file: File, _opts?: Record<string, unknown>): Promise<{ path: string } | null> => null;
      const getPublicUrl = (_path: string): string => "";

      let pdfUrl = formData.url_pdf;
      if (selectedFile) {
        const result = await uploadFile(selectedFile, { folder: "notas-fiscais" });
        if (result) pdfUrl = getPublicUrl(result.path);
      }

'''
          if text.count(dead) != 1:
              raise SystemExit('dead PDF submit block not found exactly once')
          text = text.replace(dead, '', 1)
          text = text.replace('        url_pdf: pdfUrl || null,', '        url_pdf: formData.url_pdf || null,', 1)
          text = text.replace('[formData, mode, tipoOperacao, selectedFile, notaFiscal, onClose]', '[formData, mode, tipoOperacao, notaFiscal, onClose]', 1)
          hook.write_text(text)

          reports = Path('apps/api/src/modules/reports/form-contracts/report-form-contracts.ts')
          text = reports.read_text()
          old = '''// ─── Licenciamento ──────────────────────────────────────────────────────────
// `amount`/`percentage`/`currency` são enviados pelo formulário mas NÃO
// existem no CreateLicenseDto (nem na entidade) — nunca persistem. `valor`/
// `moeda` são as colunas reais correspondentes. `remuneration_type`, embora
// exista fisicamente na entidade, também não está no DTO — excluído.
const LICENSES_CONTRACT: ReportFormContract = {
  tableName: 'licenses',
  identityColumn: 'titulo',
  fields: [
    col('titulo'), col('tipo'), col('obra_id'), col('obra_musical'), col('artista'),
    col('cliente_id'), col('cliente'), col('projeto'), col('tipo_uso'),
    col('midia_destino'), col('territorio'), col('status'),
    col('data_inicio'), col('data_fim'), col('valor'), col('moeda'), col('observacoes'),
  ],
  excludedFormFields: {},
  filterableColumns: ['status', 'tipo', 'territorio'],
  searchableColumns: ['titulo', 'obra_musical', 'artista', 'cliente', 'projeto'],
};'''
          new = '''// ─── Licenciamento ──────────────────────────────────────────────────────────
// Fonte canônica: LicencaFormModal. amount/currency são aliases lógicos das
// colunas físicas valor/moeda; percentage vive em metadata e é relido pelo
// service no mesmo campo lógico.
const LICENSES_CONTRACT: ReportFormContract = {
  tableName: 'licenses',
  identityColumn: 'titulo',
  fields: [
    col('titulo'), col('tipo'), col('obra_id'), col('artista'), col('cliente_id'),
    col('projeto'), col('midia_destino'), col('territorio'), col('status'),
    col('data_inicio'), col('data_fim'), col('remuneration_type'),
    col('currency', 'moeda'), col('amount', 'valor'), meta('percentage'),
    col('observacoes'),
  ],
  excludedFormFields: {
    obra_musical: 'duplicata textual da obra selecionada; o formulário usa obra_id',
    cliente: 'duplicata textual do cliente selecionado; o formulário usa cliente_id',
    tipo_uso: 'coluna legada sem input próprio no modal atual',
    valor: 'coluna física legada exposta pelo alias amount',
    moeda: 'coluna física legada exposta pelo alias currency',
  },
  filterableColumns: ['status', 'tipo', 'territorio', 'remuneration_type'],
  searchableColumns: ['titulo', 'artista', 'projeto'],
};'''
          if text.count(old) != 1:
              raise SystemExit('license contract block not found exactly once')
          text = text.replace(old, new, 1)
          stale = '''// CreateTakedownDto (platform/trackId/reason/requestedAt) diverge por completo
// dos nomes reais de coluna e do formulário real (TakedownFormModal.tsx, que
// usa titulo/tipo/obra_afetada/artista/.../observacoes) — bug pré-existente
// de mismatch DTO↔form, fora do escopo desta Parte. O contrato usa as colunas
// físicas reais que o formulário de fato grava; não é checado contra o DTO
// quebrado (ausente de FORM_DTO_BY_TABLE no guard test).'''
          fresh = '''// Fonte canônica: TakedownFormModal + CreateTakedownDto. O DTO e as colunas
// físicas usam os mesmos nomes; o contrato XLSX permanece 1:1 com o formulário.'''
          if text.count(stale) != 1:
              raise SystemExit('stale takedown comment not found exactly once')
          reports.write_text(text.replace(stale, fresh, 1))
          PY

      - name: Commit and remove one-off workflow
        shell: bash
        run: |
          rm .github/workflows/dev-cleanup-invoice-report-oneoff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/modules/accounting/components/nota-fiscal-form/hooks/useNotaFiscalForm.ts \
                  apps/api/src/modules/reports/form-contracts/report-form-contracts.ts \
                  .github/workflows/dev-cleanup-invoice-report-oneoff.yml
          git commit -m "fix(forms): remove dead PDF flow and align report contracts"
          git pull --rebase origin dev
          git push origin HEAD:dev
