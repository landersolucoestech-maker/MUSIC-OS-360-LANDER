name: Deploy Staging

on:
  push:
    branches: [staging]

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: production
  ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
  CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}

jobs:
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: cd apps/api && npm ci
      - run: cd apps/api && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: api-dist-staging
          path: apps/api/dist/
          retention-days: 3

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist-staging
          path: dist/
          retention-days: 3

  deploy-api-railway:
    name: Deploy API → Railway Staging
    needs: [build-api]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: api-dist-staging
          path: apps/api/dist/
      - name: Instalar Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy para Railway Staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          cd apps/api
          railway up --service api-staging --detach

  migrate-staging:
    name: Migrações DB Staging (Drizzle)
    needs: [deploy-api-railway]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      NEON_DATABASE_DIRECT_URL: ${{ secrets.NEON_STAGING_DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: cd apps/api && npm ci
      - name: Executar migrações Drizzle
        run: cd apps/api && npx drizzle-kit migrate

  deploy-web-vercel:
    name: Deploy Web → Vercel Preview
    needs: [build-web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist-staging
          path: dist/
      - name: Instalar Vercel CLI
        run: npm install -g vercel
      - name: Deploy preview Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel deploy dist/ \
            --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_ORG_ID" \
            --yes \
            --name music-os-360-staging \
            2>&1 | tee /tmp/vercel-output.txt
          echo "VERCEL_URL=$(tail -1 /tmp/vercel-output.txt)" >> "$GITHUB_ENV"
  smoke-test-staging:
    name: Smoke Test Staging
    needs: [migrate-staging, deploy-web-vercel]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    steps:
      - name: Health check API
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_API_URL/api/v1/health" || echo "000")
            echo "Tentativa $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Health check passou!"
              exit 0
            fi
            sleep 10
          done
          echo "Health check falhou após 5 tentativas"
          exit 1
