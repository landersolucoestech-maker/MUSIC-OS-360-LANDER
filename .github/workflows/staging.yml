name: Staging CI/CD

# Gate de homologacao: toda mudanca destinada a producao DEVE passar por staging.
# Requer secrets de STAGING, isolados de producao:
#   STAGING_DATABASE_URL
#   STAGING_APP_DATABASE_URL
#   STAGING_API_URL
#   STAGING_DEPLOY_WEBHOOK_URL
# Opcionais para smoke autenticado:
#   STAGING_SMOKE_TOKEN
#   STAGING_SMOKE_TENANT
# NAO usar secrets de producao aqui.

on:
  # Staging is an environment, not a branch — there is no "staging" branch in
  # this project's topology (dev/main only). Promotion to staging is a
  # deliberate, manual action (Actions tab -> Run workflow), not an automatic
  # side effect of every push to dev. Wiring this to `push: branches: [dev]`
  # would trigger a real staging deployment attempt on every dev commit,
  # which is a bigger behavior change than this cleanup is meant to make —
  # left as a documented future option, not enabled here.
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply pending TypeORM migrations to staging (unchecked = read-only db:check + RLS/isolation verification only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck lint unit build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  migrations-staging:
    name: migrations and isolation checks in staging
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      APP_DATABASE_URL: ${{ secrets.STAGING_APP_DATABASE_URL }}
      DATABASE_SESSION_CONTEXT_ENABLED: "true"
      DATABASE_RLS_ENFORCEMENT: "true"
      NODE_ENV: staging
    steps:
      - uses: actions/checkout@v4

      - name: Require staging secrets present
        run: |
          test -n "$DATABASE_URL" || { echo "::error::STAGING_DATABASE_URL secret not configured (staging environment)"; exit 1; }
          test -n "$APP_DATABASE_URL" || { echo "::error::STAGING_APP_DATABASE_URL secret not configured (staging environment)"; exit 1; }

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Validate Supabase project ref is STAGING (never DEV/MAIN) before any query
        run: pnpm --filter @music-os-360/api exec tsx scripts/verify-supabase-staging-ref.ts

      - name: db:check staging (read-only — always runs)
        id: check
        run: pnpm --filter @music-os-360/api db:check
        continue-on-error: true

      - name: Require explicit authorization to apply pending migrations
        if: steps.check.outcome == 'failure' && github.event.inputs.apply_migrations != 'true'
        run: |
          echo "::error::Pending migrations found on staging, but apply_migrations was not checked. Re-run this workflow (Actions tab) with 'Apply pending TypeORM migrations to staging' checked to authorize."
          exit 1

      - name: db:migrate staging (only with explicit authorization)
        if: steps.check.outcome == 'failure' && github.event.inputs.apply_migrations == 'true'
        run: pnpm --filter @music-os-360/api db:migrate

      - name: db:check staging (confirm zero pending after migrate)
        if: steps.check.outcome == 'failure' && github.event.inputs.apply_migrations == 'true'
        run: pnpm --filter @music-os-360/api db:check

      - name: Migration source-of-truth guard (no dual tracking, no drift)
        run: node scripts/verify-migration-source-of-truth.mjs

      - name: blocking RLS and tenant checks
        run: |
          pnpm --filter @music-os-360/api verify:rls
          pnpm --filter @music-os-360/api verify:tenant-isolation

  deploy-staging:
    name: deploy staging
    needs: [migrations-staging]
    # BUG FIXED: this used to check `github.ref == 'refs/heads/staging'` — a
    # branch that structurally can never exist in this project (staging is
    # an environment, not a branch; topology is dev/main only). That made
    # this job (and smoke-staging below) permanently unreachable dead code,
    # regardless of how the workflow was triggered. workflow_dispatch is the
    # only trigger, always run against dev; this also doubles as the
    # anti-MAIN guard (a manual dispatch against main would fail this check
    # and never deploy).
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - name: require staging deploy hook
        env:
          STAGING_DEPLOY_WEBHOOK_URL: ${{ secrets.STAGING_DEPLOY_WEBHOOK_URL }}
        run: test -n "$STAGING_DEPLOY_WEBHOOK_URL"
      - name: trigger real staging deploy
        env:
          STAGING_DEPLOY_WEBHOOK_URL: ${{ secrets.STAGING_DEPLOY_WEBHOOK_URL }}
        run: curl --fail --silent --show-error --request POST "$STAGING_DEPLOY_WEBHOOK_URL"

  smoke-staging:
    name: smoke staging
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: smoke test staging
        env:
          API_URL: ${{ secrets.STAGING_API_URL }}
          SMOKE_TOKEN: ${{ secrets.STAGING_SMOKE_TOKEN }}
          SMOKE_TENANT: ${{ secrets.STAGING_SMOKE_TENANT }}
        run: |
          test -n "$API_URL"
          pnpm --filter @music-os-360/api smoke-test

# Regra de promocao:
# - branch main/producao protegida;
# - merge para producao somente com este workflow verde no commit promovido;
# - required status checks: quality, migrations-staging, deploy-staging, smoke-staging.
