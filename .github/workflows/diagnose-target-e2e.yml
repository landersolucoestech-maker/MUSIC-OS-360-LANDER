name: Diagnose target E2E (one-shot dev)

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/diagnose-target-e2e.yml

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: musicos360
          POSTGRES_PASSWORD: ci_only_ephemeral_password_ba3f0d
          POSTGRES_DB: musicos360
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://musicos360:ci_only_ephemeral_password_ba3f0d@localhost:5432/musicos360
      APP_DATABASE_URL: postgresql://musicos_app:local_only_ephemeral_musicos_app_pw@localhost:5432/musicos360
      DB_SSL: 'false'
      ENCRYPTION_KEY: '33b29b3d331d95a7a029160cbbb4c64cc7e094271b0a6f501da19a596ade7217'
      NODE_VERSION: '20'
      PNPM_VERSION: '10.11.0'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install and prepare database
        run: |
          pnpm install --frozen-lockfile
          pnpm turbo build --filter='./packages/*'
          PGPASSWORD=ci_only_ephemeral_password_ba3f0d psql -h localhost -U musicos360 -d musicos360 -f apps/api/scripts/local-auth-shim.sql
          pnpm --filter @music-os-360/api db:migrate

      - name: Run only the three target suites
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          pnpm --filter @music-os-360/api exec jest \
            --config jest.e2e.config.ts \
            --runTestsByPath \
            test/e2e/rls/rls-isolation.e2e-spec.ts \
            test/e2e/rls/request-context.e2e-spec.ts \
            test/e2e/schema/schema-reconciliation.e2e-spec.ts \
            --json --outputFile=/tmp/target-e2e.json --forceExit \
            >/tmp/target-e2e.log 2>&1
          status=$?

          python3 <<'PY'
          import json
          import re
          from pathlib import Path

          report_path = Path('/tmp/target-e2e.json')
          if not report_path.exists():
              log = Path('/tmp/target-e2e.log').read_text(encoding='utf-8', errors='replace')[-4000:]
              clean = re.sub(r'\x1b\[[0-9;]*m', '', log)
              escaped = clean.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Target E2E did not produce JSON::{escaped}')
              raise SystemExit(0)

          data = json.loads(report_path.read_text(encoding='utf-8'))
          summary = (
              f"failedSuites={data.get('numFailedTestSuites')} "
              f"failedTests={data.get('numFailedTests')} "
              f"passedSuites={data.get('numPassedTestSuites')} "
              f"passedTests={data.get('numPassedTests')}"
          )
          print(f'::notice title=Target E2E summary::{summary}')

          ansi = re.compile(r'\x1b\[[0-9;]*m')
          for suite in data.get('testResults', []):
              suite_name = Path(suite.get('name', '')).name
              failed = [a for a in suite.get('assertionResults', []) if a.get('status') == 'failed']
              if not failed and suite.get('status') == 'failed':
                  message = ansi.sub('', suite.get('message', ''))
                  useful = next((line.strip() for line in message.splitlines()
                                 if any(token in line for token in ('Error:', 'QueryFailedError:', 'Expected:', 'Received:'))),
                                message.strip().splitlines()[0] if message.strip() else 'Suite failed')
                  payload = f'{suite_name}: {useful}'[:1500]
                  escaped = payload.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error title={suite_name}::{escaped}')
                  continue

              for assertion in failed:
                  full_name = assertion.get('fullName') or assertion.get('title') or 'failed test'
                  messages = '\n'.join(assertion.get('failureMessages', []))
                  clean = ansi.sub('', messages)
                  lines = [line.strip() for line in clean.splitlines() if line.strip()]
                  useful_lines = [line for line in lines
                                  if any(token in line for token in (
                                      'QueryFailedError:', 'Error:', 'Expected:', 'Received:',
                                      'violates', 'does not exist', 'toBe', 'toEqual'
                                  ))]
                  detail = ' | '.join(useful_lines[:5]) or (lines[0] if lines else 'failed')
                  payload = f'{full_name} :: {detail}'[:1800]
                  escaped = payload.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error title={suite_name}::{escaped}')
          PY

          exit "$status"

      - name: Remove diagnostic workflow
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/diagnose-target-e2e.yml
          git add .github/workflows/diagnose-target-e2e.yml
          git commit -m "chore(ci): remove target E2E diagnostic workflow"
          git push origin HEAD:dev

      - name: Propagate target failure
        if: ${{ steps.tests.outcome == 'failure' }}
        run: exit 1
