name: Phase 9 E2E Diagnostic

on:
  push:
    branches:
      - fix/phase9-financial-category-schema-contract
  workflow_dispatch: {}

concurrency:
  group: phase9-e2e-diagnostic-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10.11.0"
  DATABASE_URL: postgresql://musicos360:ci_only_ephemeral_password_ba3f0d@localhost:5432/musicos360
  APP_DATABASE_URL: postgresql://musicos_app:local_only_ephemeral_musicos_app_pw@localhost:5432/musicos360
  DB_SSL: "false"
  ENCRYPTION_KEY: 33b29b3d331d95a7a029160cbbb4c64cc7e094271b0a6f501da19a596ade7217

jobs:
  isolate-e2e:
    name: Isolate PostgreSQL E2E suites
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: musicos360
          POSTGRES_PASSWORD: ci_only_ephemeral_password_ba3f0d
          POSTGRES_DB: musicos360
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm turbo build --filter='./packages/*'
      - name: Apply Supabase auth shim
        run: PGPASSWORD=ci_only_ephemeral_password_ba3f0d psql -h localhost -U musicos360 -d musicos360 -f apps/api/scripts/local-auth-shim.sql
      - name: Run migrations
        run: pnpm --filter @music-os-360/api db:migrate

      - name: E2E — schema reconciliation
        id: schema
        continue-on-error: true
        run: pnpm --filter @music-os-360/api exec jest --config ./test/jest-e2e.json --runInBand --runTestsByPath test/e2e/schema/schema-reconciliation.e2e-spec.ts
      - name: E2E — RLS isolation
        id: rls_isolation
        continue-on-error: true
        run: pnpm --filter @music-os-360/api exec jest --config ./test/jest-e2e.json --runInBand --runTestsByPath test/e2e/rls/rls-isolation.e2e-spec.ts
      - name: E2E — request context
        id: request_context
        continue-on-error: true
        run: pnpm --filter @music-os-360/api exec jest --config ./test/jest-e2e.json --runInBand --runTestsByPath test/e2e/rls/request-context.e2e-spec.ts
      - name: E2E — Phase 3N context
        id: phase3n_context
        continue-on-error: true
        run: pnpm --filter @music-os-360/api exec jest --config ./test/jest-e2e.json --runInBand --runTestsByPath test/e2e/rls/phase3n-context.e2e-spec.ts
      - name: E2E — reports data
        id: reports_data
        continue-on-error: true
        run: pnpm --filter @music-os-360/api exec jest --config ./test/jest-e2e.json --runInBand --runTestsByPath test/e2e/reports/reports-data.e2e-spec.ts
      - name: E2E — Realtime broadcast authorization
        id: realtime
        continue-on-error: true
        run: pnpm --filter @music-os-360/api exec jest --config ./test/jest-e2e.json --runInBand --runTestsByPath test/e2e/realtime/realtime-broadcast-authorization.e2e-spec.ts

      - name: Diagnostic gate
        if: always()
        env:
          SCHEMA: ${{ steps.schema.outcome }}
          RLS_ISOLATION: ${{ steps.rls_isolation.outcome }}
          REQUEST_CONTEXT: ${{ steps.request_context.outcome }}
          PHASE3N_CONTEXT: ${{ steps.phase3n_context.outcome }}
          REPORTS_DATA: ${{ steps.reports_data.outcome }}
          REALTIME: ${{ steps.realtime.outcome }}
        run: |
          printf '%-36s %s\n' \
            'schema-reconciliation' "$SCHEMA" \
            'rls-isolation' "$RLS_ISOLATION" \
            'request-context' "$REQUEST_CONTEXT" \
            'phase3n-context' "$PHASE3N_CONTEXT" \
            'reports-data' "$REPORTS_DATA" \
            'realtime-broadcast-authorization' "$REALTIME"
          test "$SCHEMA" = success
          test "$RLS_ISOLATION" = success
          test "$REQUEST_CONTEXT" = success
          test "$PHASE3N_CONTEXT" = success
          test "$REPORTS_DATA" = success
          test "$REALTIME" = success
