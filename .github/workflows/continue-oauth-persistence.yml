      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: API typecheck
        run: pnpm --filter @music-os-360/api typecheck

      - name: Web typecheck
        run: pnpm --filter @music-os-360/web typecheck

      - name: API OAuth security tests
        run: pnpm --filter @music-os-360/api exec jest --config jest.config.ts --runInBand src/modules/integrations/integrations.oauth-security.spec.ts

      - name: Web OAuth security tests
        run: pnpm --filter @music-os-360/web exec vitest run --config vitest.config.mjs src/modules/integrations/pages/oauth-token-boundary.test.ts

      - name: Lint API and web
        run: |
          pnpm --filter @music-os-360/api lint
          pnpm --filter @music-os-360/web lint

      - name: Build API and web
        run: |
          pnpm --filter @music-os-360/api build
          pnpm --filter @music-os-360/web build

      - name: Commit validated patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/continue-oauth-persistence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(integrations): keep OAuth credentials server-side"
          git push origin HEAD:dev
