name: Prepare OAuth hardening PR

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/prepare-oauth-hardening-pr.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: continue-oauth-persistence-dev
  cancel-in-progress: true

jobs:
  prepare-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply patch from audited workflow
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/continue-oauth-persistence.yml')
          text = workflow_path.read_text()
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Setup pnpm"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          embedded = text[start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in embedded.splitlines()
          )
          exec(compile(script, str(workflow_path), 'exec'), {})

          # Keep all imports before runtime declarations, regardless of lint policy.
          controller_path = Path('apps/api/src/modules/integrations/integrations.controller.ts')
          controller = controller_path.read_text()
          constants_start = controller.index('const GENERIC_OAUTH_PLATFORMS')
          dto_import_start = controller.index("import {\n  ConfigureAutentiqueDto", constants_start)
          constants = controller[constants_start:dto_import_start]
          controller = controller[:constants_start] + controller[dto_import_start:]
          dto_import_end_marker = "} from './dto/integrations.dto';\n"
          dto_import_end = controller.index(dto_import_end_marker) + len(dto_import_end_marker)
          controller = controller[:dto_import_end] + '\n' + constants + controller[dto_import_end:]
          controller_path.write_text(controller)

          # Make the Jest config fixture indexable under strict TypeScript settings.
          test_path = Path('apps/api/src/modules/integrations/integrations.oauth-security.spec.ts')
          test_source = test_path.read_text().replace(
              "      })[key]),\n",
              "      } as Record<string, string>)[key]),\n",
              1,
          )
          test_path.write_text(test_source)
          PY

      - name: Create focused branch and draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="fix/oauth-token-boundary"
          rm -f .github/workflows/continue-oauth-persistence.yml
          rm -f .github/workflows/prepare-oauth-hardening-pr.yml
          git checkout -B "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(integrations): keep OAuth credentials server-side"
          git push --force-with-lease origin "$branch"
          gh pr create \
            --base dev \
            --head "$branch" \
            --draft \
            --title "fix(integrations): keep OAuth credentials server-side" \
            --body $'## Escopo\n- persiste tokens OAuth criptografados exclusivamente no backend\n- remove access/refresh tokens das respostas e do estado do browser\n- adiciona status e desconexão server-side\n- adiciona testes de regressão do limite de segurança\n\n## Restrições\n- alvo: dev\n- não altera Supabase main\n- não promove produção\n\nO merge depende de todos os jobs do CI.'
