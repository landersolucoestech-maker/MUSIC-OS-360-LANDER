name: Diagnose API E2E JSON (one-shot dev)

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/diagnose-api-e2e-json.yml

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: musicos360
          POSTGRES_PASSWORD: ci_only_ephemeral_password_ba3f0d
          POSTGRES_DB: musicos360
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://musicos360:ci_only_ephemeral_password_ba3f0d@localhost:5432/musicos360
      APP_DATABASE_URL: postgresql://musicos_app:local_only_ephemeral_musicos_app_pw@localhost:5432/musicos360
      DB_SSL: 'false'
      ENCRYPTION_KEY: '33b29b3d331d95a7a029160cbbb4c64cc7e094271b0a6f501da19a596ade7217'
      NODE_VERSION: '20'
      PNPM_VERSION: '10.11.0'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install and prepare database
        run: |
          pnpm install --frozen-lockfile
          pnpm turbo build --filter='./packages/*'
          PGPASSWORD=ci_only_ephemeral_password_ba3f0d psql -h localhost -U musicos360 -d musicos360 -f apps/api/scripts/local-auth-shim.sql
          pnpm --filter @music-os-360/api db:migrate

      - name: Run API E2E and publish structured failure
        id: e2e
        continue-on-error: true
        shell: bash
        run: |
          set +e
          pnpm --filter @music-os-360/api exec jest --config jest.e2e.config.ts --json --outputFile=/tmp/jest-e2e.json
          status=$?
          if [ -f /tmp/jest-e2e.json ]; then
            python3 <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/jest-e2e.json').read_text(encoding='utf-8'))
          lines = [
              f"numFailedTestSuites={data.get('numFailedTestSuites')}",
              f"numFailedTests={data.get('numFailedTests')}",
              f"numPassedTestSuites={data.get('numPassedTestSuites')}",
              f"numPassedTests={data.get('numPassedTests')}",
          ]
          for suite in data.get('testResults', []):
              failed_assertions = [
                  item for item in suite.get('assertionResults', [])
                  if item.get('status') == 'failed'
              ]
              if suite.get('status') != 'failed' and not failed_assertions:
                  continue
              lines.append(f"SUITE: {suite.get('name')}")
              for message in suite.get('message', '').splitlines():
                  if message.strip():
                      lines.append(message)
              for item in failed_assertions:
                  lines.append(f"TEST: {item.get('fullName') or item.get('title')}")
                  for message in item.get('failureMessages', []):
                      lines.extend(message.splitlines())
          report = '\n'.join(lines)[:50000]
          escaped = report.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f"::error title=API E2E structured failure::{escaped}")
          PY
          fi
          exit "$status"

      - name: Remove diagnostic workflow
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/diagnose-api-e2e-json.yml
          git add .github/workflows/diagnose-api-e2e-json.yml
          git commit -m "chore(ci): remove structured E2E diagnostic workflow"
          git push origin HEAD:dev

      - name: Propagate test failure
        if: ${{ steps.e2e.outcome == 'failure' }}
        run: exit 1
