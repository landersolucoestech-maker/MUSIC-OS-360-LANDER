name: Connect MusicChat to real API (one-off)

on:
  push:
    branches: [dev]
    paths:
      - scripts/connect-musicchat-real-api.py
      - .github/workflows/connect-musicchat-real-api-oneoff.yml

permissions:
  contents: write

concurrency:
  group: connect-musicchat-real-api-oneoff
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic patch
        run: python scripts/connect-musicchat-real-api.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/shared/pages/MusicChat.tsx
          git commit -m "fix(musicchat): remove hardcoded conversations and persist actions"
          git push origin HEAD:dev
