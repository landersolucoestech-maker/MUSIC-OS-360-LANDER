name: Apply branch topology fix

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/apply-branch-topology-fix.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: apply-branch-topology-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Patch CI topology
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path.cwd()

          ci_path = root / ".github/workflows/ci.yml"
          ci = ci_path.read_text(encoding="utf-8")

          old_ci_topology = """on:
            # dev = development/integration/staging, main = production. Only these two
            # branches are permanent in this project's topology; no develop/staging/
            # release/feature-pattern branches remain.
            push:
              branches: [dev, main]
            pull_request:
              branches: [dev, main]
          """
          new_ci_topology = """on:
            # Permanent promotion topology:
            #   dev -> staging -> main
            # Development, homologation and production remain isolated.
            push:
              branches: [dev, staging, main]
            pull_request:
              branches: [dev, staging, main]
          """
          if old_ci_topology not in ci:
              raise SystemExit("ci.yml topology block not found")
          ci = ci.replace(old_ci_topology, new_ci_topology, 1)

          old_step = """      - name: Verify critical workflows present
                  run: node scripts/verify-critical-workflows.mjs

          """
          new_step = """      - name: Verify critical workflows present
                  run: node scripts/verify-critical-workflows.mjs

                - name: Verify permanent branch topology
                  run: node scripts/verify-branch-topology.mjs

          """
          if old_step not in ci:
              raise SystemExit("ci.yml workflow verification step not found")
          ci = ci.replace(old_step, new_step, 1)

          gh_open = "$" + chr(123) * 2
          gh_close = chr(125) * 2
          old_prod_url = (
              "VITE_SUPABASE_URL: "
              + gh_open
              + " secrets.VITE_SUPABASE_URL || 'https://sxmfeocztlztvpdnxayk.supabase.co' "
              + gh_close
          )
          new_ci_url = (
              "VITE_SUPABASE_URL: "
              + gh_open
              + " secrets.VITE_SUPABASE_URL || 'https://ci-build.invalid' "
              + gh_close
          )
          if old_prod_url not in ci:
              raise SystemExit("ci.yml production Supabase fallback not found")
          ci = ci.replace(old_prod_url, new_ci_url, 1)

          old_dev_condition = "if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'"
          if ci.count(old_dev_condition) != 2:
              raise SystemExit("Expected exactly two DEV database job conditions")
          ci = ci.replace(old_dev_condition, "if: github.ref == 'refs/heads/dev'")
          ci_path.write_text(ci, encoding="utf-8")

          security_path = root / ".github/workflows/security.yml"
          security = security_path.read_text(encoding="utf-8")
          old_security_topology = """on:
            # dev = development/integration/staging, main = production. release/** was
            # a temporary carve-out for the now-retired release/music-os-360-hardening-dev
            # publication branch — removed now that dev is the canonical branch.
            push:
              branches: [dev, main]
            pull_request:
              branches: [dev, main]
          """
          new_security_topology = """on:
            # Permanent promotion topology: dev -> staging -> main.
            push:
              branches: [dev, staging, main]
            pull_request:
              branches: [dev, staging, main]
          """
          if old_security_topology not in security:
              raise SystemExit("security.yml topology block not found")
          security_path.write_text(
              security.replace(old_security_topology, new_security_topology, 1),
              encoding="utf-8",
          )
          PY

      - name: Materialize corrected staging files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          fetch_blob() {
            local sha="$1"
            local target="$2"
            mkdir -p "$(dirname "$target")"
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | jq -r '.content' \
              | tr -d '\n' \
              | base64 --decode > "$target"
          }

          fetch_blob "e39501bfe7bc2d1125f89d739afe503f3df05682" ".github/workflows/staging.yml"
          fetch_blob "cc67ce4ac871372fd1f0a3eeb2bfef8072ca20c6" "docs/runbooks/staging-to-production.md"
          fetch_blob "984abd5b2674e522243fdab262fd143b9b3aefdd" "scripts/verify-branch-topology.mjs"

          rm ".github/workflows/apply-branch-topology-fix.yml"

      - name: Validate branch topology
        run: node scripts/verify-branch-topology.mjs

      - name: Commit corrected topology
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            .github/workflows/ci.yml \
            .github/workflows/security.yml \
            .github/workflows/staging.yml \
            docs/runbooks/staging-to-production.md \
            scripts/verify-branch-topology.mjs \
            .github/workflows/apply-branch-topology-fix.yml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "fix(ci): restore dev staging main topology"
          git push origin HEAD:dev
