name: Diagnose API E2E (one-shot dev)

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/diagnose-api-e2e.yml

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: musicos360
          POSTGRES_PASSWORD: ci_only_ephemeral_password_ba3f0d
          POSTGRES_DB: musicos360
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://musicos360:ci_only_ephemeral_password_ba3f0d@localhost:5432/musicos360
      APP_DATABASE_URL: postgresql://musicos_app:local_only_ephemeral_musicos_app_pw@localhost:5432/musicos360
      DB_SSL: 'false'
      ENCRYPTION_KEY: '33b29b3d331d95a7a029160cbbb4c64cc7e094271b0a6f501da19a596ade7217'
      NODE_VERSION: '20'
      PNPM_VERSION: '10.11.0'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install and prepare database
        run: |
          pnpm install --frozen-lockfile
          pnpm turbo build --filter='./packages/*'
          PGPASSWORD=ci_only_ephemeral_password_ba3f0d psql -h localhost -U musicos360 -d musicos360 -f apps/api/scripts/local-auth-shim.sql
          pnpm --filter @music-os-360/api db:migrate

      - name: Run API E2E with diagnostics
        id: e2e
        continue-on-error: true
        shell: bash
        run: |
          set +e
          pnpm --filter @music-os-360/api test:e2e 2>&1 | tee /tmp/api-e2e.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 80 /tmp/api-e2e.log | while IFS= read -r line; do
              [ -z "$line" ] && continue
              escaped=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
              echo "::error title=API E2E::$escaped"
            done
          fi
          exit "$status"

      - name: Remove diagnostic workflow
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/diagnose-api-e2e.yml
          git add .github/workflows/diagnose-api-e2e.yml
          git commit -m "chore(ci): remove API E2E diagnostic workflow"
          git push origin HEAD:dev

      - name: Propagate test failure
        if: ${{ steps.e2e.outcome == 'failure' }}
        run: exit 1
