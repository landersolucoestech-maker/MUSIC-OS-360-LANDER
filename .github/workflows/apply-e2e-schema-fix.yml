name: Apply E2E schema fix (one-shot dev)

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/apply-e2e-schema-fix.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: musicos360
          POSTGRES_PASSWORD: ci_only_ephemeral_password_ba3f0d
          POSTGRES_DB: musicos360
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://musicos360:ci_only_ephemeral_password_ba3f0d@localhost:5432/musicos360
      APP_DATABASE_URL: postgresql://musicos_app:local_only_ephemeral_musicos_app_pw@localhost:5432/musicos360
      DB_SSL: 'false'
      ENCRYPTION_KEY: '33b29b3d331d95a7a029160cbbb4c64cc7e094271b0a6f501da19a596ade7217'
      NODE_VERSION: '20'
      PNPM_VERSION: '10.11.0'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm turbo build --filter='./packages/*'

      - name: Prepare ephemeral PostgreSQL
        run: |
          PGPASSWORD=ci_only_ephemeral_password_ba3f0d psql -h localhost -U musicos360 -d musicos360 -f apps/api/scripts/local-auth-shim.sql
          pnpm --filter @music-os-360/api db:migrate

      - name: Apply supplied fix
        shell: bash
        env:
          FIX_SCRIPT_B64: 
        run: |
          printf '%s' "$FIX_SCRIPT_B64" | base64 --decode > /tmp/apply_e2e_fix.py
          python3 -m py_compile /tmp/apply_e2e_fix.py
          python3 /tmp/apply_e2e_fix.py
          git diff --check

      - name: Run API E2E
        id: e2e
        shell: bash
        run: |
          set +e
          pnpm --filter @music-os-360/api test:e2e
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit target files and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-e2e-schema-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/test/e2e/rls/rls-isolation.e2e-spec.ts \
            apps/api/test/e2e/rls/request-context.e2e-spec.ts \
            apps/api/test/e2e/schema/schema-reconciliation.e2e-spec.ts \
            .github/workflows/apply-e2e-schema-fix.yml
          git commit -m "fix(e2e): reconcile fixtures with CI schema"
          git push origin HEAD:dev

      - name: Propagate E2E failure status
        if: steps.e2e.outputs.status != '0'
        run: |
          echo "::error::pnpm --filter @music-os-360/api test:e2e failed with status ${{ steps.e2e.outputs.status }}"
          exit "${{ steps.e2e.outputs.status }}"
