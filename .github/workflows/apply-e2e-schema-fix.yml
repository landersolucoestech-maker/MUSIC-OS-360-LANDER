name: Apply E2E schema fix (one-shot dev)

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/apply-e2e-schema-fix.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: musicos360
          POSTGRES_PASSWORD: ci_only_ephemeral_password_ba3f0d
          POSTGRES_DB: musicos360
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://musicos360:ci_only_ephemeral_password_ba3f0d@localhost:5432/musicos360
      APP_DATABASE_URL: postgresql://musicos_app:local_only_ephemeral_musicos_app_pw@localhost:5432/musicos360
      DB_SSL: 'false'
      ENCRYPTION_KEY: '33b29b3d331d95a7a029160cbbb4c64cc7e094271b0a6f501da19a596ade7217'
      NODE_VERSION: '20'
      PNPM_VERSION: '10.11.0'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm turbo build --filter='./packages/*'

      - name: Prepare ephemeral PostgreSQL
        run: |
          PGPASSWORD=ci_only_ephemeral_password_ba3f0d psql -h localhost -U musicos360 -d musicos360 -f apps/api/scripts/local-auth-shim.sql
          pnpm --filter @music-os-360/api db:migrate

      - name: Apply supplied fix
        id: apply
        env:
          FIX_SCRIPT_GZ_B64: 
          FIX_SCRIPT_SHA256: eb00c8b97f21894b0796b5ba326afe1c4226d92fb57edcf694b3697815adf70d
        run: |
          set -euo pipefail
          printf '%s' "$FIX_SCRIPT_GZ_B64" | base64 --decode | gzip -d > /tmp/apply_e2e_fix.py
          echo "$FIX_SCRIPT_SHA256  /tmp/apply_e2e_fix.py" | sha256sum --check -
          python3 -m py_compile /tmp/apply_e2e_fix.py
          python3 /tmp/apply_e2e_fix.py
          git diff --check
          grep -q "async function ensureE2eTenants" apps/api/test/e2e/rls/rls-isolation.e2e-spec.ts
          grep -q "async function ensureE2eTenants" apps/api/test/e2e/rls/request-context.e2e-spec.ts
          ! grep -q "read\.tipo_servico\|read\.origem_lead\|read\.probabilidade_fechamento" apps/api/test/e2e/schema/schema-reconciliation.e2e-spec.ts

      - name: Run API E2E
        id: e2e
        continue-on-error: true
        run: pnpm --filter @music-os-360/api test:e2e

      - name: Commit target files and remove one-shot workflow
        if: ${{ always() && steps.apply.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-e2e-schema-fix.yml
          git add \
            apps/api/test/e2e/rls/rls-isolation.e2e-spec.ts \
            apps/api/test/e2e/rls/request-context.e2e-spec.ts \
            apps/api/test/e2e/schema/schema-reconciliation.e2e-spec.ts \
            .github/workflows/apply-e2e-schema-fix.yml
          git diff --cached --quiet && { echo "::error::Nenhuma alteração produzida."; exit 1; }
          git commit -m "test(api): reconcile E2E fixtures with real schema"
          git push origin HEAD:dev

      - name: Propagate E2E failure
        if: ${{ always() && steps.apply.outcome == 'success' && steps.e2e.outcome == 'failure' }}
        run: exit 1
