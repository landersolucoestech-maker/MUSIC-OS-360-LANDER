name: Repair DOMPurify Lockfile

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/repair-dompurify-lock.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: Regenerate lockfile with patched DOMPurify
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Verify vulnerable DOMPurify is absent
        run: |
          if grep -q "dompurify@3.4.12" pnpm-lock.yaml; then
            echo "::error::Vulnerable DOMPurify 3.4.12 remains in lockfile"
            exit 1
          fi
          grep -q "dompurify@3.4.13" pnpm-lock.yaml
      - name: Verify production dependency audit policy
        run: node scripts/verify-production-audit.mjs
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already converged"
            exit 0
          fi
          git commit -m "fix(security): upgrade DOMPurify to 3.4.13"
          git push origin HEAD:dev
