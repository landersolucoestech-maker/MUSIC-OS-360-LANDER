name: DEV One-off — Repair Licensing Contract

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/dev-fix-licensing-oneoff.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Patch licensing form persistence and reporting
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected block not found in {path}')
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one block in {path}, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'apps/api/src/database/entities.ts',
              "  @Column({ type: 'varchar', length: 50, nullable: true }) remuneration_type: string | null;\n  @Column({ type: 'uuid', nullable: true }) artista_id: string | null;",
              "  @Column({ type: 'varchar', length: 50, nullable: true }) remuneration_type: string | null;\n  @Column({ type: 'varchar', length: 10, nullable: true }) currency: string | null;\n  @Column({ type: 'decimal', precision: 14, scale: 2, nullable: true }) amount: string | null;\n  @Column({ type: 'decimal', precision: 7, scale: 4, nullable: true }) percentage: string | null;\n  @Column({ type: 'uuid', nullable: true }) artista_id: string | null;"
          )

          dto = Path('apps/api/src/modules/licensing/dto/licensing.dto.ts')
          dto.write_text('''import { ApiProperty, ApiPropertyOptional, PartialType } from '@nestjs/swagger';
import { IsString, IsOptional, IsNumber, IsIn, IsUUID, MaxLength, Min, Max } from 'class-validator';
import { Type } from 'class-transformer';
import { PaginationDto } from '../../../common/dto/pagination.dto';

const STATUSES = ['ativa', 'negociacao', 'proposta', 'expirada'] as const;
const REMUNERATION_TYPES = ['FIXED', 'PERCENTAGE', 'FIXED_PLUS_PERCENTAGE'] as const;

/** Contrato canônico do LicencaFormModal. */
export class CreateLicenseDto {
  @ApiProperty() @IsString() @MaxLength(500) titulo!: string;
  @ApiPropertyOptional() @IsOptional() @IsUUID() obra_id?: string;
  @ApiPropertyOptional() @IsOptional() @IsString() @MaxLength(255) obra_musical?: string;
  @ApiPropertyOptional() @IsOptional() @IsString() @MaxLength(255) artista?: string;
  @ApiPropertyOptional() @IsOptional() @IsUUID() artista_id?: string;
  @ApiPropertyOptional() @IsOptional() @IsUUID() cliente_id?: string;
  @ApiPropertyOptional() @IsOptional() @IsString() @MaxLength(255) cliente?: string;
  @ApiPropertyOptional() @IsOptional() @IsString() @MaxLength(255) projeto?: string;
  @ApiPropertyOptional() @IsOptional() @IsString() @MaxLength(100) tipo?: string;
  @ApiPropertyOptional() @IsOptional() @IsString() @MaxLength(255) tipo_uso?: string;
  @ApiPropertyOptional() @IsOptional() @IsString() @MaxLength(255) midia_destino?: string;
  @ApiPropertyOptional() @IsOptional() @IsString() @MaxLength(150) territorio?: string;
  @ApiPropertyOptional({ enum: STATUSES }) @IsOptional() @IsIn(STATUSES) status?: string;
  @ApiPropertyOptional() @IsOptional() @IsString() data_inicio?: string;
  @ApiPropertyOptional() @IsOptional() @IsString() data_fim?: string;

  @ApiPropertyOptional({ enum: REMUNERATION_TYPES })
  @IsOptional() @IsIn(REMUNERATION_TYPES)
  remuneration_type?: string;

  @ApiPropertyOptional() @IsOptional() @IsString() @MaxLength(10) currency?: string;
  @ApiPropertyOptional() @IsOptional() @IsNumber() @Min(0) @Type(() => Number) amount?: number;
  @ApiPropertyOptional() @IsOptional() @IsNumber() @Min(0) @Max(100) @Type(() => Number) percentage?: number;

  /** Campos legados dual-written pelo service. */
  @ApiPropertyOptional() @IsOptional() @IsNumber() @Min(0) @Type(() => Number) valor?: number;
  @ApiPropertyOptional() @IsOptional() @IsString() @MaxLength(10) moeda?: string;
  @ApiPropertyOptional() @IsOptional() @IsString() observacoes?: string;
}

export class UpdateLicenseDto extends PartialType(CreateLicenseDto) {}

export class QueryLicenseDto extends PaginationDto {
  @ApiPropertyOptional() @IsOptional() @IsString() status?: string;
  @ApiPropertyOptional() @IsOptional() @IsString() tipo?: string;
  @ApiPropertyOptional() @IsOptional() @IsUUID() obra_id?: string;
  @ApiPropertyOptional() @IsOptional() @IsUUID() cliente_id?: string;
  @ApiPropertyOptional() @IsOptional() @IsString() search?: string;
}
''')

          service = Path('apps/api/src/modules/licensing/licensing.service.ts')
          text = service.read_text()
          text = text.replace(
              "  async create(tenantId: string, userId: string, dto: CreateLicenseDto): Promise<LicenseEntity> {\n    const item = this.repository.create({ tenant_id: tenantId, ...dto, created_by: userId, updated_by: userId } as any);\n    return this.repository.save(item as any) as any;\n  }\n\n  async update(tenantId: string, userId: string, id: string, dto: UpdateLicenseDto): Promise<LicenseEntity> {\n    await this.findById(tenantId, id);\n    await this.repository.update({ id, tenant_id: tenantId } as any, { ...dto, updated_at: new Date(), updated_by: userId } as any);\n    return this.findById(tenantId, id);\n  }",
              "  private normalizePayload(dto: CreateLicenseDto | UpdateLicenseDto): Record<string, unknown> {\n    const payload: Record<string, unknown> = { ...dto };\n    if (dto.amount !== undefined) payload.valor = dto.amount;\n    if (dto.currency !== undefined) payload.moeda = dto.currency;\n    return payload;\n  }\n\n  async create(tenantId: string, userId: string, dto: CreateLicenseDto): Promise<LicenseEntity> {\n    const item = this.repository.create({\n      tenant_id: tenantId,\n      ...this.normalizePayload(dto),\n      created_by: userId,\n      updated_by: userId,\n    } as Partial<LicenseEntity>);\n    return this.repository.save(item as LicenseEntity);\n  }\n\n  async update(tenantId: string, userId: string, id: string, dto: UpdateLicenseDto): Promise<LicenseEntity> {\n    await this.findById(tenantId, id);\n    await this.repository.update(\n      { id, tenant_id: tenantId } as never,\n      { ...this.normalizePayload(dto), updated_at: new Date(), updated_by: userId } as never,\n    );\n    return this.findById(tenantId, id);\n  }"
          )
          if text == service.read_text():
              raise SystemExit('licensing service block not replaced')
          service.write_text(text)

          replace_once(
              'apps/api/src/modules/reports/form-contracts/report-form-contracts.ts',
              "// `amount`/`percentage`/`currency` são enviados pelo formulário mas NÃO\n// existem no CreateLicenseDto (nem na entidade) — nunca persistem. `valor`/\n// `moeda` são as colunas reais correspondentes. `remuneration_type`, embora\n// exista fisicamente na entidade, também não está no DTO — excluído.\nconst LICENSES_CONTRACT: ReportFormContract = {\n  tableName: 'licenses',\n  identityColumn: 'titulo',\n  fields: [\n    col('titulo'), col('tipo'), col('obra_id'), col('obra_musical'), col('artista'),\n    col('cliente_id'), col('cliente'), col('projeto'), col('tipo_uso'),\n    col('midia_destino'), col('territorio'), col('status'),\n    col('data_inicio'), col('data_fim'), col('valor'), col('moeda'), col('observacoes'),\n  ],\n  excludedFormFields: {},",
              "// Fonte canônica: LicencaFormModal.tsx. Os campos condicionais de\n// remuneração são colunas próprias; valor/moeda permanecem apenas como legado\n// dual-written e não aparecem no XLSX.\nconst LICENSES_CONTRACT: ReportFormContract = {\n  tableName: 'licenses',\n  identityColumn: 'titulo',\n  fields: [\n    col('titulo'), col('tipo'), col('obra_id'), ro('artista'), col('cliente_id'),\n    col('projeto'), col('midia_destino'), col('territorio'), col('status'),\n    col('data_inicio'), col('data_fim'), col('remuneration_type'),\n    col('currency'), col('amount'), col('percentage'), col('observacoes'),\n  ],\n  excludedFormFields: {\n    obra_musical: 'duplicata textual da obra selecionada; o formulário usa obra_id',\n    cliente: 'duplicata textual do cliente selecionado; o formulário usa cliente_id',\n    tipo_uso: 'coluna legada sem input próprio no modal atual',\n    valor: 'legado dual-written de amount',\n    moeda: 'legado dual-written de currency',\n  },"
          )

          migration = Path('apps/api/src/database/migrations/20260804000001_LicenseRemunerationColumns.ts')
          migration.write_text('''import type { MigrationInterface, QueryRunner } from 'typeorm';

/** Persiste 1:1 os campos condicionais de remuneração do LicencaFormModal. */
export class LicenseRemunerationColumns20260804000001 implements MigrationInterface {
  name = 'LicenseRemunerationColumns20260804000001';

  async up(qr: QueryRunner): Promise<void> {
    await qr.query(`ALTER TABLE "licenses" ADD COLUMN IF NOT EXISTS "currency" VARCHAR(10)`);
    await qr.query(`ALTER TABLE "licenses" ADD COLUMN IF NOT EXISTS "amount" NUMERIC(14,2)`);
    await qr.query(`ALTER TABLE "licenses" ADD COLUMN IF NOT EXISTS "percentage" NUMERIC(7,4)`);
    await qr.query(`UPDATE "licenses" SET "currency" = "moeda" WHERE "currency" IS NULL AND "moeda" IS NOT NULL`);
    await qr.query(`UPDATE "licenses" SET "amount" = "valor" WHERE "amount" IS NULL AND "valor" IS NOT NULL`);
  }

  async down(qr: QueryRunner): Promise<void> {
    await qr.query(`ALTER TABLE "licenses" DROP COLUMN IF EXISTS "percentage"`);
    await qr.query(`ALTER TABLE "licenses" DROP COLUMN IF EXISTS "amount"`);
    await qr.query(`ALTER TABLE "licenses" DROP COLUMN IF EXISTS "currency"`);
  }
}
''')

          index = Path('apps/api/src/database/migrations/index.ts')
          text = index.read_text()
          marker = "import { CreateContractServiceTypes20260803000003 } from './20260803000003_CreateContractServiceTypes';"
          if marker not in text:
              raise SystemExit('migration import marker not found')
          text = text.replace(marker, marker + "\nimport { LicenseRemunerationColumns20260804000001 } from './20260804000001_LicenseRemunerationColumns';", 1)
          marker2 = "  CreateContractServiceTypes20260803000003,\n] as const;"
          if marker2 not in text:
              raise SystemExit('migration array marker not found')
          text = text.replace(marker2, "  CreateContractServiceTypes20260803000003,\n  LicenseRemunerationColumns20260804000001,\n] as const;", 1)
          index.write_text(text)
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/database/entities.ts \
                  apps/api/src/database/migrations/index.ts \
                  apps/api/src/database/migrations/20260804000001_LicenseRemunerationColumns.ts \
                  apps/api/src/modules/licensing/dto/licensing.dto.ts \
                  apps/api/src/modules/licensing/licensing.service.ts \
                  apps/api/src/modules/reports/form-contracts/report-form-contracts.ts
          git commit -m "fix(licensing): persist the complete remuneration form"
          git push origin HEAD:dev
