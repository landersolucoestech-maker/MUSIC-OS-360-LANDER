name: Dev Rotate And Validate Login Oneoff (Parte 75 — temporary, removed after use)

# One-off, push-triggered (workflow_dispatch only registers from the
# default branch, never touched here) workflow that:
#   1) rotates the tenant-zero institutional owner's password on Supabase
#      DEV to a fresh value using the corrected, copy/paste-safe charset;
#   2) confirms DIRECT_AUTH_SUCCESS via a real signInWithPassword call;
#   3) revalidates the full required-password-change flow end-to-end
#      against the real compiled API (Parte 74's mechanism, unchanged,
#      re-run from scratch per Parte 75's explicit demand);
#   4) rotates once more to the FINAL provisional password and confirms
#      IT ALSO authenticates via a real login BEFORE the report reveals it.
# TENANT_ZERO_PRINT_PASSWORD_I_ACCEPT_THE_RISK is set deliberately for this
# single authorized run, same scoped exception already accepted in Partes
# 73/74. Committed, run once, then removed in a follow-up commit, and the
# Supabase secrets are removed right after too.

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/dev-rotate-and-validate-login-oneoff.yml"

concurrency:
  group: dev-rotate-and-validate-login-oneoff
  cancel-in-progress: false

jobs:
  rotate-and-validate:
    name: Rotate institutional password and validate real login on Supabase DEV
    runs-on: ubuntu-latest
    environment: development
    if: github.ref == 'refs/heads/dev'
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      TENANT_ZERO_OWNER_EMAIL: "deyvisson@landerrecords.com"
      TENANT_ZERO_PRINT_PASSWORD_I_ACCEPT_THE_RISK: "yes"
      NODE_ENV: "development"
      NODE_VERSION: "22"
      PNPM_VERSION: "10.11.0"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Supabase project ref is DEV (never MAIN/STAGING/prod) before any query
        run: pnpm --filter @music-os-360/api exec tsx scripts/verify-supabase-dev-ref.ts

      - name: Build workspace packages (@music-os-360/types etc. — the compiled API requires their dist/ output at runtime)
        run: pnpm turbo build --filter='./packages/*'

      - name: Build the API (the validation script boots the compiled binary, same as production)
        run: pnpm --filter @music-os-360/api build

      - name: Rotate the institutional password and validate real login end-to-end
        run: pnpm --filter @music-os-360/api exec tsx scripts/parte75-rotate-and-validate-login.ts
