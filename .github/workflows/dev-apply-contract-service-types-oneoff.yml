name: Dev Apply Contract Service Types Oneoff (Parte 83 — temporary, removed after use)

# Manually-triggered (via scoped push, since workflow_dispatch only registers
# from the default branch, which is never touched here), one-off workflow to
# apply the pending APPLICATION migration
# (CreateContractServiceTypes20260803000003) on the real Supabase DEV branch,
# reusing the same "development" GitHub Environment DATABASE_URL secret the
# read-only CI jobs already use. Segmented executor (db:migrate:application)
# — deliberately does NOT touch RealtimeBroadcastAuthorization20260801000001
# (EXTERNAL_MANAGED). Committed, run once, then removed in a follow-up commit
# — same pattern as dev-migrate-oneoff.yml (Parte 71) and
# dev-apply-application-oneoff.yml (Parte 72).

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/dev-apply-contract-service-types-oneoff.yml"

concurrency:
  group: dev-apply-contract-service-types-oneoff
  cancel-in-progress: false

jobs:
  apply-contract-service-types-dev:
    name: Apply CreateContractServiceTypes20260803000003 on Supabase DEV
    runs-on: ubuntu-latest
    environment: development
    if: github.ref == 'refs/heads/dev'
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NODE_VERSION: "20"
      PNPM_VERSION: "10.11.0"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Supabase project ref is DEV (never MAIN/STAGING/prod) before any query
        run: pnpm --filter @music-os-360/api exec tsx scripts/verify-supabase-dev-ref.ts

      - name: db:check:application (before) — informational, must not block migrate
        run: pnpm --filter @music-os-360/api db:check:application
        continue-on-error: true

      - name: db:migrate:application — apply the pending APPLICATION migration
        run: pnpm --filter @music-os-360/api db:migrate:application

      - name: db:check:application (after) — must report zero pending
        run: pnpm --filter @music-os-360/api db:check:application

      - name: Migration source-of-truth guard
        run: node scripts/verify-migration-source-of-truth.mjs

      - name: verify:rls (all tenant tables have RLS + policies)
        run: pnpm --filter @music-os-360/api verify:rls

      - name: verify:tenant-isolation (real cross-tenant DB proof)
        run: pnpm --filter @music-os-360/api verify:tenant-isolation
