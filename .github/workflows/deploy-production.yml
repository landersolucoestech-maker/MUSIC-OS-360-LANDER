name: Deploy Production

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_ENV: production
  ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
  CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}

jobs:
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: cd apps/api && npm ci
      - run: cd apps/api && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: api-dist-production
          path: apps/api/dist/
          retention-days: 7

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist-production
          path: dist/
          retention-days: 7

  deploy-api-railway:
    name: Deploy API → Railway Production
    needs: [build-api]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: api-dist-production
          path: apps/api/dist/
      - name: Instalar Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy para Railway Production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
        run: |
          cd apps/api
          railway up --service api-production --detach

  migrate-production:
    name: Migrações DB Production (Drizzle)
    needs: [deploy-api-railway]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      NEON_DATABASE_DIRECT_URL: ${{ secrets.NEON_PRODUCTION_DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: cd apps/api && npm ci
      - name: Executar migrações Drizzle
        run: cd apps/api && npx drizzle-kit migrate

  deploy-web-vercel:
    name: Deploy Web → Vercel Production
    needs: [build-web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist-production
          path: dist/
      - name: Instalar Vercel CLI
        run: npm install -g vercel
      - name: Deploy produção Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel deploy dist/ \
            --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_ORG_ID" \
            --prod \
            --yes \
            --name music-os-360

  smoke-test-production:
    name: Smoke Test Production
    needs: [migrate-production, deploy-web-vercel]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Health check API
        env:
          PRODUCTION_API_URL: ${{ secrets.PRODUCTION_API_URL }}
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PRODUCTION_API_URL/api/v1/health" || echo "000")
            echo "Tentativa $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Health check passou!"
              exit 0
            fi
            sleep 15
          done
          echo "Health check falhou após 5 tentativas"
          exit 1

  notify-sentry:
    name: Notificar Sentry Release
    needs: [smoke-test-production]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Criar release Sentry
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production
          version: ${{ github.ref_name }}
