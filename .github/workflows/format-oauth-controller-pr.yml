name: Format OAuth controller PR

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: format-oauth-controller-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  format:
    if: github.event.pull_request.head.ref == 'fix/oauth-token-boundary'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Restore class indentation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('apps/api/src/modules/integrations/integrations.controller.ts')
          source = path.read_text()
          start = source.index("  @Post('oauth/exchange')\n")
          end = source.index('  // ─── Status geral', start)
          block = source[start:end]
          lines = block.splitlines(keepends=True)
          if len(lines) < 2:
              raise SystemExit('OAuth controller block is unexpectedly empty')
          if lines[1].startswith('  @Public'):
              raise SystemExit(0)
          if not lines[1].startswith('@Public'):
              raise SystemExit(f'Unexpected OAuth decorator indentation: {lines[1]!r}')
          formatted = lines[0] + ''.join(
              ('  ' + line if line.strip() else line)
              for line in lines[1:]
          )
          path.write_text(source[:start] + formatted + source[end:])
          PY

      - name: Commit formatting when changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Controller already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/modules/integrations/integrations.controller.ts
          git diff --cached --check
          git commit -m "style(api): restore OAuth controller indentation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
