name: Dev Rotate And Validate Password Flow Oneoff (Parte 74 — temporary, removed after use)

# One-off, push-triggered (workflow_dispatch only registers from the
# default branch, never touched here) workflow that:
#   1) rotates the tenant-zero institutional owner's password on Supabase
#      DEV to a fresh, never-reused value — this alone invalidates the
#      provisional password exposed during Parte 73, without ever reading
#      or retransmitting that old value;
#   2) runs a real end-to-end validation of the Parte 74 password-change
#      flow against the real API (same guards/filters as production) and
#      the real Supabase Auth;
#   3) rotates once more to the FINAL provisional password handed to the
#      user, with must_change_password=true.
# TENANT_ZERO_PRINT_PASSWORD_I_ACCEPT_THE_RISK is set deliberately for this
# single authorized run, same scoped exception already accepted for Parte
# 73 (the account requires a password change at first login regardless).
# Committed, run once, then removed in a follow-up commit, and the
# Supabase secrets are removed right after too.

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/dev-rotate-and-validate-password-flow-oneoff.yml"

concurrency:
  group: dev-rotate-and-validate-password-flow-oneoff
  cancel-in-progress: false

jobs:
  rotate-and-validate:
    name: Rotate compromised password and validate the flow end-to-end on Supabase DEV
    runs-on: ubuntu-latest
    environment: development
    if: github.ref == 'refs/heads/dev'
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      TENANT_ZERO_OWNER_EMAIL: "deyvisson@landerrecords.com"
      TENANT_ZERO_PRINT_PASSWORD_I_ACCEPT_THE_RISK: "yes"
      NODE_ENV: "development"
      NODE_VERSION: "22"
      PNPM_VERSION: "10.11.0"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Supabase project ref is DEV (never MAIN/STAGING/prod) before any query
        run: pnpm --filter @music-os-360/api exec tsx scripts/verify-supabase-dev-ref.ts

      - name: Build the API (the validation script boots the compiled binary, same as production)
        run: pnpm --filter @music-os-360/api build

      - name: Rotate compromised password and validate the required-password-change flow end-to-end
        run: pnpm --filter @music-os-360/api exec tsx scripts/parte74-rotate-and-validate-password-flow.ts
