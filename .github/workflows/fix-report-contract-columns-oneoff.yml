name: Fix report contract columns (one-off)

on:
  push:
    branches: [dev]
    paths:
      - scripts/fix-report-contract-columns.py
      - .github/workflows/fix-report-contract-columns-oneoff.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix-report-contract-columns.py
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/modules/reports/form-contracts/report-form-contracts.ts
          git commit -m "fix(reports): include repeating fields in contract columns"
          git push origin HEAD:dev
