name: Branch Policy

on:
  create:
  push:
    branches: [main, dev, staging]
  workflow_dispatch: {}
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: branch-policy
  cancel-in-progress: false

jobs:
  enforce:
    name: Enforce permanent branch topology
    runs-on: ubuntu-latest
    steps:
      - name: Delete every unauthorized branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "create" ]]; then
            ref_type=$(jq -r '.ref_type // empty' "${GITHUB_EVENT_PATH}")
            if [[ "${ref_type}" != "branch" ]]; then
              echo "Create event is not a branch; nothing to enforce."
              exit 0
            fi
          fi

          is_allowed() {
            case "$1" in
              main|dev|staging) return 0 ;;
              *) return 1 ;;
            esac
          }

          mapfile -t branches < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name'
          )

          removed=0
          for branch in "${branches[@]}"; do
            if is_allowed "${branch}"; then
              continue
            fi

            echo "Deleting unauthorized branch: ${branch}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            removed=$((removed + 1))
          done

          mapfile -t remaining < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name'
          )

          invalid=0
          for branch in "${remaining[@]}"; do
            if ! is_allowed "${branch}"; then
              echo "::error::Unauthorized branch still exists: ${branch}"
              invalid=1
            fi
          done

          if [[ "${invalid}" -ne 0 ]]; then
            exit 1
          fi

          echo "Branch topology enforced. Removed ${removed} branch(es)."
          printf 'Permanent branches: main, dev, staging\n'
