name: Security Scan

on:
  push:
    # release/** carries the controlled publication of previously-local
    # history (see release/music-os-360-hardening-dev) — PRs against it need
    # real secret-scanning coverage too, not just main/develop.
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop, "release/**"]
  schedule:
    # Run weekly on Monday at 08:00 UTC regardless of pushes
    - cron: "0 8 * * 1"

permissions:
  contents: read
  security-events: write # required for CodeQL / Sarif upload

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10.11.0"

jobs:
  # ─── Dependency vulnerability scan ───────────────────────────────────────────
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (critical + high)
        run: pnpm audit --audit-level=high --prod
        # Fail the pipeline for high/critical vulnerabilities in production deps
        continue-on-error: false

  # ─── SBOM generation ─────────────────────────────────────────────────────────
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install CycloneDX CLI
        run: npm install -g @cyclonedx/cyclonedx-npm

      - name: Generate SBOM (API)
        run: cyclonedx-npm --package-lock-only --output-file sbom-api.json
        working-directory: apps/api

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: apps/api/sbom-api.json
          retention-days: 90

  # ─── CodeQL SAST ─────────────────────────────────────────────────────────────
  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # ─── Secret scanning check ────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SECRET-01 regression: the .gitleaks.toml allowlist used to blanket-exempt
      # docs/**/*.md from scanning entirely. Prove that's fixed by planting a
      # synthetic (never-real) secret under docs/ and confirming gitleaks still
      # catches it. Uses the official gitleaks image directly (docker is
      # preinstalled on ubuntu-latest) — same maintainer as gitleaks-action above.
      - name: SECRET-01 regression — synthetic secret in docs/ must be detected
        run: |
          TARGET="docs/__gitleaks_regression_test__.md"
          # NOT AWS's canonical "AKIAIOSFODNN7EXAMPLE" placeholder (gitleaks'
          # default ruleset has a built-in `.+EXAMPLE$` allowlist for it), and
          # NOT an arbitrary AKIA+16-alphanumeric string either: `:latest`
          # below floats (confirmed v8.30.1, vs. v8.24.3 pinned by
          # gitleaks-action@v2 above — real version drift within this same
          # job) and v8.30.1 tightened the aws-access-token regex to
          # [A-Z2-7]{16} (real AWS key IDs are Base32 — no 0/1/8/9). This
          # value uses only [A-Z2-7] in its suffix so it matches both
          # versions; entropy ~4.0, verified against the real image first.
          echo "Synthetic AWS key (never real): AKIAQZM3XKPL4WYVB2RS" > "$TARGET"
          trap 'rm -f "$TARGET"' EXIT
          set +e
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --no-git -v
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::error::gitleaks did NOT detect the synthetic secret under docs/ — the SECRET-01 fix may have regressed"
            exit 1
          fi
          echo "OK — gitleaks detected the synthetic secret under docs/ (SECRET-01 regression test passed)"
