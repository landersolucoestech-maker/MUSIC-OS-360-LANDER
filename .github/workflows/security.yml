name: Security Scan

on:
  # dev = development/integration/staging, main = production. release/** was
  # a temporary carve-out for the now-retired release/music-os-360-hardening-dev
  # publication branch — removed now that dev is the canonical branch.
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    # Run weekly on Monday at 08:00 UTC regardless of pushes
    - cron: "0 8 * * 1"

permissions:
  contents: write
  security-events: write # required for CodeQL / Sarif upload

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10.11.0"

jobs:
  repair-oauth-web-types:
    name: Repair OAuth web types
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/oauth-token-boundary'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Align canonical client and OAuth types
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_or_verify(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text()
              if old in text:
                  path.write_text(text.replace(old, new, 1))
                  return
              if new in text:
                  return
              raise SystemExit(f'{label}: neither old nor expected new content found')

          replace_or_verify(
              Path('apps/web/src/modules/settings/pages/Configuracoes.tsx'),
              '''                onConnect={async (platform, scopes, access_token) => {
                  await connectMarketing(platform, scopes, access_token);
''',
              '''                onConnect={async (platform, scopes) => {
                  await connectMarketing(platform, scopes);
''',
              'MarketingOAuthDialog callback signature',
          )

          replace_or_verify(
              Path('apps/web/src/modules/crm-relationships/types/index.ts'),
              '''  endereco?: string | null;
  status?: string | null;
''',
              '''  endereco?: string | null;
  cep?: string | null;
  status?: string | null;
''',
              'Cliente CEP field',
          )

          replace_or_verify(
              Path('apps/web/src/modules/crm-relationships/hooks/useContacts.ts'),
              '''    endereco: c.endereco_completo ?? c.address ?? null,
    status: c.status ?? null,
''',
              '''    endereco: c.endereco_completo ?? c.address ?? null,
    cep: c.cep ?? null,
    status: c.status ?? null,
''',
              'ApiClient to Cliente CEP mapping',
          )

          replace_or_verify(
              Path('apps/web/src/modules/accounting/components/nota-fiscal-form/hooks/useNotaFiscalForm.ts'),
              '      tomador_endereco: cliente.endereco || cliente.endereco_completo || "",\n',
              '      tomador_endereco: cliente.endereco || "",\n',
              'Nota fiscal canonical client address',
          )

          Path('.github/web-repair-trigger.txt').unlink(missing_ok=True)
          Path('.github/workflows/fix-dev-typecheck-blockers.yml').unlink(missing_ok=True)
          PY

      - name: Commit reviewed web fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Web types already aligned"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(web): align OAuth and client invoice types"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  # ─── Dependency vulnerability scan ───────────────────────────────────────────
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit policy (waivers)
        run: node scripts/verify-production-audit.mjs
        # Runs the real `pnpm audit --prod` and fails only on advisories that
        # are NOT covered by an explicit, non-expired waiver in
        # scripts/dependency-audit-waivers.json — see that file for the
        # currently-accepted advisories, owners and review dates.
        continue-on-error: false

      - name: Dependency audit verifier unit tests
        run: node --test scripts/verify-production-audit.test.mjs

  # ─── SBOM generation ─────────────────────────────────────────────────────────
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install CycloneDX CLI
        run: npm install -g @cyclonedx/cyclonedx-npm

      - name: Generate SBOM (API)
        run: cyclonedx-npm --package-lock-only --output-file sbom-api.json
        working-directory: apps/api

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: apps/api/sbom-api.json
          retention-days: 90

  # ─── CodeQL SAST ─────────────────────────────────────────────────────────────
  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # ─── Secret scanning check ────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SECRET-01 regression: the .gitleaks.toml allowlist used to blanket-exempt
      # docs/**/*.md from scanning entirely. Prove that's fixed by planting a
      # synthetic (never-real) secret under docs/ and confirming gitleaks still
      # catches it. Uses the official gitleaks image directly (docker is
      # preinstalled on ubuntu-latest) — same maintainer as gitleaks-action above.
      - name: SECRET-01 regression — synthetic secret in docs/ must be detected
        run: |
          TARGET="docs/__gitleaks_regression_test__.md"
          # NOT AWS's canonical "AKIAIOSFODNN7EXAMPLE" placeholder (gitleaks'
          # default ruleset has a built-in `.+EXAMPLE$` allowlist for it), and
          # NOT an arbitrary AKIA+16-alphanumeric string either: `:latest`
          # below floats (confirmed v8.30.1, vs. v8.24.3 pinned by
          # gitleaks-action@v2 above — real version drift within this same
          # job) and v8.30.1 tightened the aws-access-token regex to
          # [A-Z2-7]{16} (real AWS key IDs are Base32 — no 0/1/8/9). This
          # value uses only [A-Z2-7] in its suffix so it matches both
          # versions; entropy ~4.0, verified against the real image first.
          echo "Synthetic AWS key (never real): AKIAQZM3XKPL4WYVB2RS" > "$TARGET"
          trap 'rm -f "$TARGET"' EXIT
          set +e
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --no-git -v
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::error::gitleaks did NOT detect the synthetic secret under docs/ — the SECRET-01 fix may have regressed"
            exit 1
          fi
          echo "OK — gitleaks detected the synthetic secret under docs/ (SECRET-01 regression test passed)"
