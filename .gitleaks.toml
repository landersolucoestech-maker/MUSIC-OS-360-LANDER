# gitleaks config — extends the default ruleset with project allowlists.
# Only confirmed false positives are allowlisted (local tooling, test fixtures,
# CI dummy values, internal audit docs). No real-secret rule is weakened.
title = "MUSIC OS 360 gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "False positives: local tooling, test fixtures, CI dummies, env templates, audit docs"
paths = [
  # Local Claude Code tooling config (shell-command strings).
  '''\.claude/.*''',
  # Env templates — placeholders only (YOUR_ANON_KEY, etc.).
  '''.*\.env\.example''',
  '''\.env\.staging\.example''',
  # Local dev/test scripts: mint fake JWTs / probe env.schema with dummy values.
  '''apps/api/scripts/fase9-tokens\.js''',
  '''apps/api/scripts/fase94b-tokens\.js''',
  '''apps/api/scripts/fase10-prod-env-check\.cjs''',
  '''apps/api/scripts/fase1d-recovery\.ts''',
  # SECRET-01 regression-test fixture: the SOURCE of the synthetic AWS key
  # used to prove gitleaks scans docs/**/*.md — same category as the
  # fase9-tokens.js-style entries above. Deliberately a PATH allowlist, not a
  # value allowlist: the value must stay detectable in the throwaway
  # docs/__gitleaks_regression_test__.md file the test generates at runtime
  # (a different path, not covered here), or the regression test proves
  # nothing. Only these two files, which just declare the constant, are
  # exempted.
  '''scripts/test-gitleaks-docs-coverage\.sh''',
  '''\.github/workflows/security\.yml''',
  # SECRET-01: a blanket `docs/.*\.md` path allowlist used to live here, exempting
  # the entire docs tree (including every audit doc this project generates) from
  # secret scanning. Illustrative examples in docs are covered by the specific
  # regexes below instead — a real secret pasted into any doc is now detected.
]
regexes = [
  # Intentionally-invalid JWT fixture used in tests.
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.invalid\.payload''',
  # Shared dev/CI test ENCRYPTION_KEY / JWT signing key (never a prod secret).
  '''33b29b3d331d95a7a029160cbbb4c64cc7e094271b0a6f501da19a596ade7217''',
  # All-zero dummy ENCRYPTION_KEY used in CI docker runs.
  '''0{40,}''',
  # Obvious placeholder values.
  '''deadbeef''',
  '''eyJanon''',
  '''eyJservice''',
  '''re_realdev_prod_key''',
]
