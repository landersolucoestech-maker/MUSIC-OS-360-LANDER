packages:
  - "apps/*"
  - "packages/*"

# Moved from package.json's "pnpm.overrides" (Parte 84) — pnpm no longer
# reads that field ("The pnpm field in package.json is no longer read by
# pnpm... pnpm.overrides"), which meant every entry below was silently
# inert. Discovered chasing a real, newly-surfaced CI failure (Dependency
# Audit: socket.io-parser 4.2.6 high-severity zero-attachment memory
# exhaustion, GHSA id 1130713, fixed >=4.2.7) — added that entry and
# relocated the rest verbatim so they actually take effect again.
overrides:
  "js-yaml@>=4.0.0 <4.3.0": ">=4.3.0"
  "multer@<2.2.0": ">=2.2.0"
  "ws@>=8.0.0 <8.21.0": ">=8.21.0"
  "qs@>=6.11.1 <=6.15.1": ">=6.15.2"
  "lodash@<=4.17.23": ">=4.18.0"
  "@opentelemetry/core@<2.8.0": ">=2.8.0"
  "protobufjs@<=7.6.4": ">=7.6.5"
  "brace-expansion@^2.0.0": ">=2.1.2 <3.0.0"
  "brace-expansion@^5.0.0": ">=5.0.9 <6.0.0"
  "express>body-parser": ">=2.3.0"
  "@nestjs/platform-express>body-parser": ">=1.20.6 <2.0.0"
  "@nestjs/typeorm>uuid": ">=11.1.1"
  "socket.io-parser@>=4.0.0 <4.2.7": ">=4.2.7"
