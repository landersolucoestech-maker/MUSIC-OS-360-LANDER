<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232563EB'/%3E%3Ctext x='16' y='23' font-family='Arial,sans-serif' font-size='20' font-weight='bold' fill='white' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E" />
    <title>MUSIC OS 360 - Gestão Musical Completa</title>
    <meta name="description" content="Plataforma operacional para gravadoras, editoras, produtoras e equipes da indústria musical." />
    <meta name="author" content="MUSIC OS 360" />

    <meta property="og:title" content="MUSIC OS 360 - Gestão Musical Completa" />
    <meta property="og:description" content="Centralize artistas, catálogo, contratos, financeiro, marketing e lançamentos." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />

    <!-- Google Fonts: Plus Jakarta Sans + IBM Plex Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Theme initialization script - prevents flash of wrong theme -->
    <script>
      (function() {
        const theme = localStorage.getItem('theme') || 'dark';
        const root = document.documentElement;
        if (theme === 'system') {
          const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          root.classList.add(isDark ? 'dark' : 'light');
        } else {
          root.classList.add(theme);
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
